body:
  text: 法制一本寺改為十方常住規約二十條附庫房列職規銘客堂規約禪堂規約共住規約本寺定為十方選賢叢林住持一席不拘法派不分畛域凡十方僧眾有合格者皆可被選為住持即本寺原有喝雲派下資格相當者亦有被選為住持之權利住持資格必湏在三十六歲以上宗教兼通行解相應能說法開導後學領眾坐禪行道眾望相孚者為合格住持選舉權應屬退居和尚前任住持及兩序首領執事公同選舉不受寺外各界干涉叢林規制以大眾為主體兩序首領執事即主體之代表住持選舉法由現住持請退居和尚及兩序首領執事開選舉會以現住持為議長或退居和尚亦可倘現住持及退居和尚俱無公推班首一人為議長先由議長報告選舉權及被選資格令眾聞知請眾推舉一人付眾表決果係才德兼備眾望所歸各無異議即由監院具書啟請為住持先推一人外各退居首領更有推舉多人資格相等難分優劣者則議長再舉二人為監察更用記名投票法公舉五人向韋馱神前拈鬮卜選先拈出三次者為當選其餘四名不得作為候補下屆選舉時必經重選方得下鬮因恐其人始終不一故現住持徒眷法眷即有合格之人本屆不能被選須待下次如退居和尚一人派下有堪入選者多人每次亦只能選一人此條之規定係防微杜漸恐十方叢林復變為子孫也現住持祇有提議取決之權不得加入公舉人數倘眾人公舉不足推現住持舉時方可有選舉權所舉之人亦須付眾表決以符公意住持任期以三年為一任如果有功常住眾心悅服連舉者得連任不得過二次交替時間定四月初八日而選舉時間定二月十五日以便舉後啟請預備進院交替時所有常住存款只許盈餘不許虧損如有虧損當令賠償滿足住持進院齋堂設如意齋一堂安眾進院賀客齋飯及開銷各項概歸常住負擔賀禮亦歸常住收領住持徒眷法眷不得充當首領權職如住持三年任內世緣不順或年老多病不能領眾者不拘年限可許告退倘假公濟私藐法毀規不盡寺主責任有負住持名義者許眾僧通白兩序首領公同令退再行選舉倘若挾嫌陷害察出即當反坐重責驅擯不服者稟官究治住持任滿退居本寺祇得另住房間以便靜養客堂吃飯不得另行開房立派若新住持請為寮主護持常住亦可圓寂後所有財物均歸常住與徒眷無涉在寺之日常住要事請議自當秉公為眾平時諸事各有權限不得時加干涉果見住持執事有大妨碍當住之事可邀兩序首領公議辦法住持不得在寺內剃度徒眷不得時常付法但有信仰之人可收為皈依弟子至第三年任期將滿可以傳戒一次付法一次尤宜擇人不可濫付其法派其徒眷倘有恃勢違犯清規平等議罰不服者出院如係法派則公請追繳法卷免辱祖庭住持領眾行道宗教並重講經坐禪上殿過堂以振道風而宣佛化不可苟圖安逸辜負學者如有挾情私見欲變十方為子孫者十方僧眾本寺兩序皆可出首稟官驅逐以保公權而維十方常住退居和尚名位既尊不可再入卜選如果常住彫敞欲期整頓非某退居不可者即由兩序首領公請復位主席住持請職須要量才取用不可徇私凡所請首領當委以職權責任辦法以清權限庫房客堂維那寮衣鉢寮是謂四大寮住持凡有大事必湏請四寮共議不可獨斷獨行常住產業無論何人不得變賣抵押銀錢物件不得私借私送監院總理合寺大綱都監而居監督地位此二執事輔弼住持調理大眾必須才能練達因果分明者為合格庫房進出銀錢由典賦管流水副寺管總清監院管銀錢住持都監均得隨時稽查賬目銀錢盈餘當擇銀行或穩妥錢莊存放生息以備舉行慈善事項置業修造之用凡置業修造等項達五百元以上者皆要與四寮共議或住持監院好大喜功硬欲作主者其經費常住不負責住持及庫房客堂二寮執事及維那寮所有衣單之資依照舊例於客廳茶禮所進之款抽取十分之二有利均分不宜厚薄大小執事任期以六個月為限限滿告退連請者始得連任俱應遵住持之約束一寮之中不得多安同鄉以及同派恐其樹立黨羽挾制常住無論何人不得在寺內剃度收徒傳付法卷及收皈依弟子寺外不在此例住持另有專條規定及住持大眾每期詣韋馱神前告香一次即剖明心迹以俾有所警策本寺叠蒙官廳保護有案可稽向無山主檀越以及董事各色寺內諸事由住持與兩序首領執事會議舉行各界不得加入干涉凡施主來山祈福超薦修建佛事理宜齋戒不得擅將葷腥入寺邀妓彈唱致凟佛天以招罪過蔬笋清談宜為原諒庫房列職規銘愛惜常住物如護眼中珠興利莫若除弊盡公自爾無私信施脂膏沾染便成孽海伽藍因果明察即是福基銘曰物屬招提絲毫毋犯守在爾躬必慎必憚清若澄潭正如直幹無曲無私何憂何患一有差池龍天較勘都監乃上輔住持安撫大眾下匡監院察理諸事如常住要務施主應酬一切皆其責也雖不如監院之辛勞理事而大端則須總持故亦名總理須久充庫職諳練熟識者為合格乃安享之任也監院為住持右臂乃列職領袖全寺綱維司其職者須發大心扶持常住弊端要革利益常行一寺隆替所攸關也總理庶務栽培田園出納錢米酬應檀護及常住宿交之官紳皆其事也此執歸住持與班首執事商酌而請須察其人因果分明精嚴戒行如所請非人常住受害必須才德兼優者充之至常住之動產及不動產處處巡防庫職諸事得宜不得宜時時察視若遇大事當呈白和尚妥貼方行小事亦須白知諸執可行則行勿得自專所為悖理諸人解勸仍屬執拗不從者亦須以理處斷不得私擅己意亦不可徇情副寺乃長一寺之財政凡常住存項大宗支收總清部冊分明登載大眾飲食日用所需加意覺察預先備辦庶免臨時倉卒若所法官紳游玩名士蒞寺倘知賓不在或周旋不到者宜幫為招待然後呈報住持當家請見以禮而諸茶頭行為不中庫司諸執宜以相當而教誡之知產乃一寺農工部長凡田山園林蔬果等項培植收成應時得宜湏濕當收留心照應監工人之勤務察田山之耕營驗力務之能否定重輕之工資切勿徇情以失得當應用器具亦宣隨時修澰免致損失知賓典執賓客似乎一寺之外交無論善信進香名士游玩俱宜謙恭盡禮至誠相待請問姓名來意居址不可忽慢倘有宿交護法現任官紳須先禮待後白住持當家或請方丈或任官廳茶點齋飯隨宜欵待毋得失儀若有香資禮物宜交典賦收記倘有意外之交涉必以和平主决以示讓步事在不得已者宜盡職爭囘故湏隨事見機方圓兼濟而不可無事藉端私逞己能監修料理匠作科派工程督工人之勤務隨事指揮檢房屋之故漏當修則修如有大宗建築關要事宜須與監院商酌住持裁奪方可舉行不得私擅每日工賬逐節報典登載以免遺誤十日結算存清須請監院副寺看過至四期終宜請兩序公算而副寺知賓亦可隨時檢查免致失誤櫃頭亦名庫頭管理常住被鋪席帳器皿家具食品等物收曝出內俱應加意殷勤何物將盡應辦即辦何物損壞當修則修如欲採辦之物應白副寺審查定奪倘有借還之端須報典記以免失誤買辦司理上街採辦常住應用物品均由副寺支款典賦列單依式辦之囘即報賬查記毋得混淆失誤典座調理人客點心齋席等事時序豐略均由陪客者指陳辦之不得擅任庫房諸事雖有條列各專其司然非分河飲水如該事屬他執之務或者該執不在或者一人周旋不到必須和衷共濟互相照料以為一寮之團體以上諸方各執均以一人主之本寺因人才困乏未敢規定如監院副寺知賓櫃頭知產是所不免若監修典賦買辦典座等若人才充補則可增用不然或由住持委任或可他執代管事無一定隨時變通可也客堂規約擔囊負缽本為參尋撥草瞻風曾無別事既垂見訪宜禁喧囂諸事安排百凡隨眾動靜凜乎人表閑忙卓先眾先有法可嚴有依可範如此法器可謂高流所有規條幸宜共鑒知客執典賓客凡客到若僧若俗無論高下俱要謙和盡理請問姓名居址及其來意不可怠慢若有求住僧至須詳審來歷略述常住家風這邊與諸方不同一年一期無論內外寮單自送單日起至明年今日為一期中途不好告假或諸方尊宿到寺一面接待一面差招客通知住持然後參見次者或客堂接待庫房報菜點雲水衲僧至不拘有無公事須照應如法見禮貌不恭者隨時警策其威儀端肅者謙詞慰問此關常住道風不可忽慢至送單亦不拘一例諸方耆德送尊客寮舊住消假遠來禪和酌妥安送至如混雜之輩早到一餐晚到一宿即催別行毋使稽延滋生事端放假日期知客須在客堂靜候內外諸師到客堂請假上街須囑其買畢就囘不可無事在街上游玩如往別駢當問明告假幾日係往何方期滿不歸者罰內外諸師有口角相爭者知客為其理直不服者請眾同寮公議處罰內外諸師出入不到客堂告假銷假及在外三五成羣閑游放逸者罰執事人知而不舉者同罰凡有佛事齋供預先寫牌至時令照客懸掛事畢即收勿得遺誤糾察亦名僧值即是僧中值日管事者凡殿堂及坡事俱要向前認真照應不得落後能使眾僧威儀整肅出入循規者惟賴此一人專主如避賴偷安以致失誤者罰門戶火燭時常檢察各處香燈該管之地俱令打掃潔淨無論內外執事皆得隨時經管書記專主書疏榜牒牌示及掛號等事若無此執即知客僧值亦可代之但湏字跡端楷不可潦草糾察每日寺中各處巡行一週有不如法處即當白眾此雖糾察之責而知客當巡行若殿堂坡事等若無僧值或僧值有病即知客公務勿致失誤客堂諸事和衷共濟互相照應客堂諸師如逢外寮僧行有病亦須巡視囑人看顧如果病重即白庫房延醫備藥若有病重垂危者即同庫房將病人衣服銀錢用牌登記暫寄庫房不許亂動若臨終之際客堂諸人念佛助送往生此關人人不免各宜努力至於估倡開消之法亦有規則期頭請執舊執許退則以好言安慰或留者更須仔細警省如請新執當先留心察看量才安執其間不可存私若請衣砵燒香侍者當隨和尚之意如請櫃頭知產知賓等當與監院商酌其餘列執行單則可專與同寮籌請之禪堂規約古規失檢怠惰成風時弊多端提持貴密雖則成公案須要大家共知知行解相應則無愧於先宗道德兼資乃有利於末學是在同志共相遵守犯根本大戒者出堂刁唆是非交拳相打破口相罵者出堂鐘板為龍天耳目大眾號令參差失誤者巡寮跪香不服者出堂堂中閑談什話及靜响動驚眾者重罰鳴小板參差失錯者罰值日交代不清及失誤巡散香者罰行香坐香不到止靜不到及闖靜者罰經行時任意涕唾談舌呼欠及鞋物作聲者罰出入不白職事及在堂竄單亂位穿堂直過者罰出外不穿長衫不縛褲脚及有事他出歸期失限者罰上殿過堂次第而行不得進前落後交頭雜話違者罰出入往還沿路不得東觀西望及隨意吐痰者罰不顧本分亂逞機鋒妄作拈頌評論公案者罰私借堂中什物出外用者罰打破器皿者罰賠閑竄寮房私造飲食及私吃煙賭博放逸者罰檢點他人是非攪羣亂眾者重罰堂中出外滋生事端者嚴罰滋事失儀不聽職事規諫者罰不服者出堂各人聞四板响不起及鳴楗搥不到者罰開大靜後在外高聲語笑出外竄寮者罰無事須在本寮誦習縱意妄談什麽者罰巡香徇情或以公報私者罰無病殿堂不到及坡事不隨眾者罰坐香故縱昏沉及爭香者板者罰住不滿期不許出堂若私逃單者拿着加罰經行念佛默不作聲及捺鞋嬉者罰尊客參堂各依位坐不得失儀違者罰街以每月初八廿三日為限餘時不准私上街者罰共住規約棲心息影端藉名藍修道循規必須同志久參耆宿以遊歷深而百姓從生後進時流因知見淺而初心漸退以致綱宗失旨模範多乖習以為然積成流弊拙住茲山自愧薄德空懷佛制無報法門欲挽已往之頹風惟冀方來之賢眾共遵佛制戒律祖定規繩調治三業折伏過非住斯叢林原為遵行如或不然毋得共住犯根本大戒者不共住鬥爭是非破口相罵交拳相打者不論曲直均出院誘掖外人破壞常住思和合僧者不共住刁唆是非攪羣亂眾破和合僧才示共住保留有大過之人及年輕者不共住無事私走檀護私自募化不共住侵損常住財物及私斫菓木送人情者罰賠出不守清規不存正念錯昧因果者不共住私吃煙酒及賭博看戲者重罰若有病非酒莫療者白眾方服輕視耆德惡聞直言妄生譏毀者重罰私應經懺及私招徒眾者重罰無事在山門外三五成羣遊戲雜語者罰無事閑闖寮房及出外縱意放逸者罰二時功課三時念佛及出坡事不隨眾罰除老病及公事非理責人私心袒護私留親朋歇宿不白職事者重罰不習僧體威儀粗心忽略不遵職事約束者罰所司不盡職失誤公事者罰堂中出外生事者嚴擯藉事起單者重罰出入不白職事不穿長衫不縛褲脚及假期失限者罰小恙不白聽事公事不到者罰無事不得二堂不得爭坐位不得未結齋先起自持碗取食違者罰常住賬目出入登記若失誤及含糊不清者罰常住米麥等物不白眾私賣用者罰賠已出院常住經典莊嚴法器不白眾私借與人者罰無病告假避懶偷安及私造飲食者察出加罰破期告假及住不滿期私自逃單託事告假者重罰街假以每月初八廿三為限餘時不許告假違者罰叢林無僧值內外不整弊何能除法焉能立為僧值者宜盡心糾察不得徇情如有犯者照款舉罰失罰者僧值自受罰以上條約誠為辦道之規則同居大眾各宜珍重二本寺水池區管理規則普照寺蓮花洞等處由本寺安人住修亦同一本寺阿耨達池及附近之兜率陀院須摩提國阿蘭若處總名曰水池區適用本規則以管理之二本區所置一切房屋器具皆本寺所有其用途皆由本寺支配任何私人不得據為己有及由私之佔用之三本區劃定為本寺之退居寮及安置緇素靜修之客或老修行班首之處四本區兜率陀院設慈宗壇湏摩提國設蓮宗壇永遠供奉不得撤廢五本區除本寺之退居及老班首外其他緇素來客之暫住必須知賓或知客送入安置餘人不得自由支配六本區房屋器具等或係施主捐設但施主或其友好欲來居住亦須事前通知本寺酌為安置不得逕自出入七本區由客堂安一好靜修行之香燈師看守之平時聽庫房或客堂之招呼照管一切嚴禁來客等鴉片賭博絃歌葷酒及留宿婦女諸事以保靜潔八本區住退居或來客時如須役使由庫房臨時撥用來客日用所湏由常住供給者由來客隨宜酬報常住九本區所住之退居或老班首如因事外出他去湏將寮房鑰匙交付香燈師掌管以便常住須時可移充他用十本區所住之退居或班首除本人居住外不得招致徒眷或親友同住以杜變成房頭小菴之弊端十一本規則由本寺公同議决訂立之民國二十二年二月一日住持太虛公布
