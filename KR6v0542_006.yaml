body:
  text: 文藝一詩林嘉慶己卯仲夏司榷鷺江偶占扇亭四絶蘇修順深林一扇亭結構肖山形撲却塵三斗泉聲聒耳聽渾忘三伏熱兩袖引清風爽籟天然至無勞展動工似扇羣峰繞幽亭號不虛居然攜六月博得右軍書好是鄰方丈清談四大空深慚無玉帶留挂此亭中南普陀雜詠虞愚片石滯山中風來吼不動怕受三界煎逃入蓮花洞蓮花洞淙淙寫我心湛湛清且美誰識此池中長流八德水阿耨達池天地猶囊槖出處如羈旅何地可成心是阿蘭若處阿蘭若處注成心現成本有之真心出莊子齊物論有樹可庥風有泉可瀹煮此國真極樂何用西方去須摩提國按須摩提梵語極樂義青山亦好藏環繞自成位藉問倦遊人誰知普照寺普照寺普照寺明劉汝楠野寺前朝建空門大壑開鳴鐘霜氣動拂席雨華回石倚天星落江涵晚照來山中詢法侶塵劫幾成灰其二前人華月蘸清樽虛庭露氣繁懸猿啼白壑歸鳥度黃昏樹色搖山殿江聲到寺門上方詩品寂永夜不聞喧太虛臺晚眺大醒太虛臺建在南普陀寺後山為湖北李子寬居士造而紀念太虛大師者太虛臺上望田野罷躬耕日向西山落雲從谷底生深林歸鳥宿大海客舟行一色長天水此時無限情兜率陀院題壁前人兜率陀院築於庚午年初築時余題其名蓋南普陀寺退院和尚轉逢預為太虛大師退居而築者後傍巖阿前臨水池一靜境也陳鏡秋蘇慧純二居士時喜居此余來居之七日偶成五律一首用志因緣院傍巖阿築名題兜率陀天宮禮彌勒丈室住維摩滿架經書疊當窗草木多一池泉水靜來去不生波太虛臺民國二十年李基鴻所建以紀念太虛大師者虞愚地接諸天近臺高萬象空濤者漁火外雲影佛光中渺渺微塵相恢恢濟世功師年來弘法宇內轉移世道與有力焉人間多難日獨立意忡忡五老山宋滕翔海翻波浪繞羣峯無盡崖前此界空不是灰心求佛者片時難在寂寥中遊南普陀佟法海天水蒼茫一望同何妨海外説真空詩人便是開山祖風雅禪林鷺島中恭和佟法海題南普陀石壁梁文煊洛伽普照命名同色相聲音盡是空石上宰官新詠在五燈收入七言中七月十二日偕小遷警豫學琰詞源諸子訪大醒法師於南普陀之兜率陀院賦此謝雲聲兜率陀宮聯袂過窗明几淨傍巖阿秋荷別作青藍色蓮花有青藍色産印度梵語曰優鉢羅佛書多以為眼目之喻足證高僧待我多其二前人論文談藝慰無聊鎮日間愁萬丈消還約明月三五夜追蹤坡老謁參寥東坡居士嘗於月夜訪參寥上人中元節遊南普陀寺夜半留別大醒達安二吟長前人高談良會中元節遺却間愁滌却心歸路懸思人境外月明如雪夜鐘沉五老山明池顯方十年古剎幾殘灰重見天花散講臺野露欺人疑結雨松風括地每驚雷一泓碧水和雲下萬點青山擁海來若問箇中真普照峰頭夜半月輪開道光壬午大暑後五日升晉亭司馬令嗣春臺上舍胡柳園張雲巖言子純三參軍楊藕塘孝廉金肖巖太學同集南普陀漫賦陳性普陀名勝共登臨排立豐碑翁翠深巨石觸雲通海氣幽蘭入座悅禪心滄桑閲盡山俱古風月清涼雨又今此地朋簪容易盍嶙峋最上且題襟同治四年三月統率六師航海援閩駐軍南普陀武進餘曙題此以志郭松林平生心迹向誰論笑對滄溟酒一樽敢望殊功垂海甸欲除元惡報君恩三千羆虎屯雲氣萬頃波濤捲浪痕莫道桃源無處是人間此地即桃源普陀寺汪士傑鐘鼓樓高寶殿雄大江南滙小林東流飛石筧山腰水聲落松濤谷口風梵磬靜時僧入定海雲寒處鴈橫空渾疑身到潮音路不盡天花法界中遊南普陀寺贈太虛上人歐陽小桃參來禪悅破情關大悟人間即夢間誰喝偈詞來鷲嶺我開梵唄寫春山千般世網能拋盡一著袈裟便等間為問文殊詩集未漫披詩稿乞加刪和答前韶太虛詩人榮杖叩禪關幾度行吟曲徑間萬樹幽松依曲徑一泓清水出深山靜觀雲岫渾無賴卻羡林禽自在間付與鐘聲自生滅滿階春草未須刪南普陀題名太虛南海普陀崇佛剎虎溪白鹿擬匡廬千巖百洞奇難狀隕石飛星古所都水鳥皆談不生法林雲巧繪太平圖山獅十八驚呼起一吼當今萬象蘇南普陀題壁即次太虛大師原韻陳桂琛擎大柱折孤臣死演武場開古佛廬結社因緣依五老涅槃聲價邁三都縱教劫火成灰燼旋見禪宮入畫圖偶與參寥一酬唱此身宛在夢中蘇南普陀題壁次太虛大師原韻虞愚鷺江浩瀚復何極萬頃驚濤撼佛廬風嘯北關古天塹雲對太武舊仙都鐘聲洗斷英雄淚樹隙描成村落圖無數暮煙懷古意高吟直喚海大蘇太虛大師南普陀題石敬和原韻寄塵鷺江梵剎普陀寺紺宇琳宮盡石廬雲木參差遮佛窟煙霞迷漫鎖仙都花開勝地疑香海月滿中天人畫圖夢遂江楓漁火遠此身疑是在姑蘇題廈門南普陀寺前人南海普陀水國居蛟龍出沒氣常噓波翻特現蓮花界浪湧輸來貝葉書七寶禪林僧住久三乘妙諦法傳初而今直躡爛那寺障道妖氛一掃除壬甲三月漳州失守率隊來厦八月遊南普陀寺次太虛大師題壁原韻黃懋和十年荏苒閩江住辜負春山未結廬橐筆昔曾參翔幕逃禪今復過仙都秋風到處添詩料明月依人似畫圖最喜生公能説法中原民困幾時蘇二序記閩南佛學院緣起文常惺茫茫五趣濟濟羣生迷幻質之非我執緣影以為心計斷計常固乖平等之真性事水事火尤屬顛倒之盲修非仗我佛宏慈曷階菩提妙果是以迦維示迹半滿齊宣諸子病多三車藥廣既明諸佛出世之本懷乃盡一期之能事繄維東震佛法緣深雖地殊禹域未蒙金口之親宣而像教東流莫非覺皇之垂範什師傳般若奘師譯瑜伽空有並彰遮表齊致五葉流芳既顯東土大乘之特彩兩都奏續實傳南天鐵塔之真詮至若五時八教直揭如來誰化之宏綱六相十玄大明緣起無礙之法界震旦儼為世界第二佛教國矣惜乎宋元以降義學不興先賢遺籍流亡海外向上一著固難使中下以湊泊六字真詮尤未便家喻而戶曉以至無上妙味流為人天有漏之因異熟招感轉變異端祈禱之果浸假誤樂國為天堂迷緣變為他造紫色奪朱哇聲亂鼓反觀教中小乘自囿者山藏林竄以鳴高世利相牽者稗販鑽營為事業置利生於不顧視三藏若具文無怪社會視佛法為消極主義目僧界為無用廢民矣邇者海內諸先覺不忍大教淪湑青年埋沒先後提倡教育設立學院以期扶衰救弊探驪得珠奠世界永遠之和平謀人羣真正之幸福閩南地處海隅交通阻絶學者負笈視海程為畏途同人等目擊神傷義難袖手爰議組織閩南佛學院設普通科以通各宗之郵設專修科深造一門之極庶幾成就有人重復唐代之盛軌宣傳可託普救法界之迷情化機巧為和平轉濁世成淨土則他年自他道圓華藏海淨未始不基於今日之發覺初心也廈門南普陀重建觀音殿募捐緣起芝峯宇宙間之形色事物無一而非變幻成毀之現象有情類之見聞覺知亦無一而非相續生滅之心識雖然吾人能變之心識與所變之現象生也滅也成也毀也大有濯足長流抽足再入已非前水之概唯而現象之實體心識之真性法爾如如未嘗起生滅成毀之衝動楞嚴經説變者自滅彼不變者元無生滅是也然而現象之與實體心識之與真性猶水之興波相推相演作向上之進展故釋迦世尊曰普願法界衆生共入毗廬性海能荷我佛之絶大使命於諸世間有情而無厭倦者其唯觀音大士乎大士自謂因入流相得三摩地又謂當於萬億劫悲願度衆生此即大士將自心所證悟之理智隨有情生滅之心識假宇宙成毀之現象建水月道場做空花佛事也我中國廈門南普陀寺者為觀音大士應機現真之古剎不唯維繫全國全閩及南洋僑胞信仰植福之中心點實亦國體所關為東西洋各國人士觀瞻之所也寺不戒於火於本年古曆九月二十三日致觀音殿全部焚燬此乃世相本量無常所謂變者自滅無足驚異然以大士平等無差別智觀之猶將此空移置彼空所謂不變者元無生滅也今者廈門人士及全寺僧衆亟謀恢復舊觀窮其用意無非欲本諸生滅之心識而探究其真性隨成毀之現象求證其實體然則唯其如是則捨先覺觀音大士所悟證之理智其誰依乎此舉也不僅為信佛者當仁不讓而亦懚為我國各界士女願所樂聞隨喜贊襄也發起人吳乾元阮順永葉敦仁陳佑全黃廷元蔣以德洪鴻儒黃奕住陳宗書林文慶黃慶元楊景文曾厚坤蔡秋濤陳益安蔡契誠陳玉琮陳秉璋黃繩其余少文莊文洲陳敬賢陳極星陳廷祉陳耕業葉鶴秋陳耀焜葉偕福釋轉逢蘇慧純釋瑞于釋曾泉釋轉道釋轉塵釋轉物釋太虛中華民國十七年十月日南普陀兜率院記文淵南普陀為廈門之名勝亦閩南之古剎也負山環海風景天然昔日大悲菩薩應化所在香火因緣至今不替故普陀之名靡不聞焉寺後有峯名曰五老層巒聳翠林木暢茂致春秋佳日士女如雲或聽鶯啼鳥語或觀紫竹黃花遙望海波蕩漾沙鷗明滅而鼓浪諸嶼玲瓏如畫朝暮陰晴氣象萬千遠近來遊者無不歡喜踴躍心曠神怡張大河題曰海上神山洵不虛矣民國十九年夏普陀常住於山腰向有慧泉外新修自來水池一方方廣五六丈周圍以石其圓靈源浩瀚澄青一色偶然想望塵斛頓消所謂清池皓月露禪心者歟池後因有隙地數畝寺衆遂營造別院三楹傍通空洞成天然石室顏曰兜率以作本寺住持太虛上人來時靜修之用真清幽之勝境也蓋襲名以兜率云者取知足之意耶或曰據兜率為一生補處所居本無漏之聖地何得名此區區一院哉余曰本寺住持太虛大師為當代之高僧作法門之領袖遠承慈氏之心要近闡相宗之遺風瑜伽妙義唯識真乘以及大乘各宗教義莫不藉師發揚光大况大師定慧兩融悲智雙運以慈氏之心為心菩薩之行為行兼平日以慈宗二要自行化他信受奉持以廣大願心求生內院當來上品往生如操左券也語云服堯之服語堯之言行堯之事是堯而已矣今大師住慈氏之家説慈氏之法行慈氏之道亦是慈氏而已矣是院之名兜率不亦宜乎取其名者為大醒法師其亦有斯意存乎民國二十年四月十八日記於閩南佛學院本寺後山太虛台之外景按此台係民國二十年為湖北李子寬居士建築紀念太虛大師者編輯謹識本寺後山水區之兜率陀院外景本寺之阿耨達水池按此池係太虛大師住持本寺時造太虛台上之鳥瞰按山下為本寺全景遠處洋房多座者則為廈大學本寺後山之小亭二太虛大師之石刻南普陀寺重建大悲殿記南普陀寺之興起近數十年事耳然南普陀之得名蓋由奉觀世音菩薩故斯殿之建築殆有百年矣逮大悲殿落成繼之又造天王殿規模漸備自開設閩南佛學院之後南普陀寺遂成蜚聲海內外之一名剎顧斯殿乃反形短小而不相稱十七年夏曆九月二十三日之夕殿中忽然起火殿乃被燬豈菩薩之靈特諉之以除舊布新之責耶時余尚遊化歐土旋由本寺邀集廈門各界洪曉春陳少梧諸紳耆組籌募重建委員會別設會計經營建築不敷時由庫房支濟八角三層之式仍舊貫而放大加高俾可與前之二殿相稱歷時四年有餘始成計用銀約五萬元而庫房支濟者亦達六七千元經辦者為都監轉逢會泉監院覺斌大醒芝峰副寺智普宏聰瑞立等而蘇慧純蔡吉堂林鏡秋諸居士亦襄助其事余則坐享厥成而已今定名曰大悲殿乃敘其重建緣起並將捐款各施主姓名列后以志功德勒碑永垂不朽民國二十二年二月一日住持太虛謹記南普陀寺林園記南普陀寺四管之附近山地本甚遼闊而比年以來廈門市場之發達一日千里先是自來水公司設水池於寺右鼓山之下已侵用本寺山地若干至漳厦警備司令部堤工處路政辦事處成立來聞山闢路數年間頓令廈門全島改觀本寺之附近山地亦由華僑組織興業公司及楊德從先生向路政處購闢為新區其勢逼近本寺肘腋間且有將本寺全部山地充為南普陀公園之議寺甚岌岌可危乃由本寺歷與路政處等洽商歷時數月幾經曲折至本年二十二年一月二十八日始由路政處給豫證明書並附圖劃定界址解決為本寺林園地區而此事之成多出路政處周醒南會辦之鼎力維持他若省府蔣景然主席為致書會辦張瀾溪陳李梁二先生為疏通興業公司曾國明先生為接洽楊德從先生及蘇慧純蔡吉堂黃秋聲居士并本寺轉逢會泉都監覺斌大醒芝峯寄塵監院先後奔走各方皆與有力焉今本寺已次第植樹造林以期為厦市培成一名勝形勝之山林區域欲使後之住居遊覽於是者皆紀念功德之所自爰志其經過如此民國二十二年二月一日南普陀住持太虛謹記南普院寺水池區建築記南普陀寺自改十方叢林制設閩南佛學院住僧漸多舊在山左之接水時不敷用民十八於山右新獲一水源由寺築水池以蓄之甘美清冷分布皆足其用乃命名阿耨達池民十九為護池建屋其上曰兜率陀院久之又開洞室曰須摩提國轉逢退居及林鏡秋蘇慧純居士曾協欵以助其成民二十一年又於洞後闢建禪室曰阿蘭若處則由陳敬賢王真覺蘇慧純居士施資之所造其工事則均出逢退居督理今總名之曰水池區議訂規則十一條管理之因記其功德云民國二十二年二月一日本寺住持太虛南普陀遊記東初中國之南鷺江之濱有南普陀寺焉遠築於五代高峯崚嶺崛起海隅與隔太武對峙儼然成為南天勝景其間聖賢遞嬗勝衰迭起有言不可及之慨矣寺之起焉與唐之開元而並古分派珞伽觀音大士之道場也寺初名曰普照遜清康熙間始改今名凡仰光三江緇素渡廈朝禮觀音大士者咸住錫於此故聲馳宇內名揚中外矣寺原為子孫傳法之制度至轉逢長老始慧眼獨具遂毅然改為十方選賢之制度自改組以還初任住持者乃會泉和尚同時乃有僧教育之施設繼任者則為佛化新興運動太虛大師也大師駐錫後僧教育遂得擴而充之聲譽馳全國故渡海來廈親近大師者接踵而來唯恐落後至今已逾八載矣寺本無恆産能維八載如一日之僧教育不特為南國開一新紀元亦為全國僧教育之罕聞也今之全國有恆産寺院者不下萬餘對於茲寺能無愧乎寺中所有之建築以本地所産花岡石黃磚鋼瓦為大宗殿宇巍峩氣象森嚴規模宏敞清淨為比而天王寶殿大雄寶殿大悲殿等均為近十年來重新之建築也大悲殿工竣伊始蓋舊殿民十七年秋燬于火太虛大師即與全寺執事商議力謀重建故此殿不特為全寺建築之冠亦為太虛大師駐錫南普陀寺之偉大建築也余肄業閩院故對于寺之風景及建築物等較他人為詳茲不憚煩瑣略記如下寺前有放生池四圍雕以七如來名號蓋取如來以大悲為願渡生為懷且一切衆生皆有如來智慧德相苦未證耳中養龜鱉魚等物其他豬牛羊鹿等物均有飼養之廄蓋今之世界保護動物提倡蔬食運動不獨佛教為然即歐西文明先進諸國亦有蔬食運動之提倡如英美德法俄胸加利荷蘭等國均有保護動物提倡蔬食之運動一九二五年曾有萬國茹素大會開於倫敦一九二九年復開第七次國際蔬食大會於捷克斯羅瓦國此國之地址介於德奧兩國之間他若倫敦蔬食會美國蔬食會枚不勝舉且各國於法律均有規定保護動物之明文而每年為動物起訴者亦不下數千件其他英德法意胸加利等國關於保護動物之法律不計外美利堅尤可讚嘆因一九三十年三月美國人道教育所得本國各地之報告計一個月之間此項新慈善團體成立之總數為一千三百十組平均計之則每三十五分鐘即有一組成立也因此文明先進之國家提倡蔬食保護動物於此可見一班矣蓋今之歐西各民族咸感科學利器之殘酷養成人類凶橫之惡性保護動物提倡蔬食豈僅動物之福音實是人類和平之嚆矢也環顧吾國不特於法律夫規定保護動物之明文泰半則以彼生者必為我食殊不知爾與彼同一動物安有食彼彼食此肉食殘忍之權耶天王寶殿重建於民國甲子年中奉彌勒如來左右四金剛怒目擎拳威猛無比進山門則彌勒如來笑顏可掬恍若龍華三會相臨接引來者蓋我佛如來將滅度之時將法會所有之弟子咸付於彌勒如來故也有緣者會於蘢華吾人應集中之信仰與努力耳中為大雄寶殿此殿重建於民十四前鐘鼓樓巍然相峙旁有羅漢堂建築堂皇得未曾有松柏雜立幽香撲鼻花香鳥語如入園林其中奉娑婆教主本師釋迦牟尼佛佛之侍者曰摩訶迦葉曰阿難陀乃佛之十大弟子中之一也佛之側有佛二曰西方極樂世界接引阿彌陀佛曰東方琉璃世界消災延壽藥師佛而西方世界東方世界其國衆生無有衆苦但受諸樂唯我娑婆世界五濁惡世我諸衆生但受其苦無有衆樂故我佛如來大悲願力常施於娑婆世界所謂開佛之知見入佛之知見悟入佛之知見是也又有梵天帝釋鵠立於傍此無他乃表示護持大法之熱誠耳後則大悲殿高十餘丈為新落成者石柱巍煥周列石欄莊嚴無比梯楷而上中奉千手千眼大悲救世觀音大士蓋觀世音大士乃西方三聖之一也佛以東方為娑婆世界故大士其大悲救世之願力亦常施設於東方大士靈感勝迹其夥但以文字而論觀者見之事音者聞之事而觀音大士則以聞之事為觀以觀之事為聞此無他乃大士六根清淨互為攝用以千手千眼之神慧運四八之宏願觀一切衆生之苦厄施設梵音妙音海潮音充滿於東方娑婆世界使無量無邊一切衆生皆成正覺故婦人孺子莫不咸知誦觀音大士之聖號亦可見觀音大士之宏願矣每屆朔望則全市人士莫不爭先恐後敬禮焉二六九等月十九日為尤勝香煙裊裊瀰漫天際寺無恆産一切支配賴此維持焉寺之風景最幽者則為後山新建之兜率陀院也由大悲殿繞向背山不數武五老峰下有二停焉名人題詠滿於石壁松檜橫陳叢柏森立卉木幽邃日月晦明百鳥橫舞歌詠不絶清脆悅耳間有微香撲鼻襲人欲醉洵為海上神山也由此崎嶇右繞而上奇石林立崖洞幽壑峯回路轉別一天地而森林深處蠕蠕而動者則為放生巨蟒出沒其中也蟒馴艮為善從未傷人豈受觀音大士感化所致歟行行重行行則頂門隻眼及兜率陀院燦然遙現於雲表矣蓋此院建築乃轉逢長老預備於太虛大師退院後而同居者院前有阿耨達池流泉斷續若奏梵音寺之飲料全賴乎斯院高丈餘飾以堊粉瑩潔清雅悅人心目中闢佛堂一設慈宗壇奉彌勒如來供養花果備極莊嚴為太虛大師每返寺時於此自修耳蓋大師為中國佛教倡導慈宗之宗師也又客一風景相片懸於滿壁青風謖謖音韻悠揚憑几而視則遠山近水屏列如畫遊目其間飄飄欲仙矣其後寢室榻一空無所有似維摩室寺之護法蘇君慧純陳君敬賢時過小住大醒法師嘗住其中并題有詩云院傍巖阿築名題兜率院天宮禮彌勒丈室住維摩滿架輕書疊當窗草木多一池泉水靜來去不生波可謂題盡院景矣復有須摩提國築於院側前有八功德池滿種青蓮懸崖絶壁奇巖穹隆鑿谷為窟可容四榻簷飛丈餘周圍隆起古洞綿延佛像林立設瑜伽焰口曼怛囉壇乃轉逢長老發大悲願施千座瑜伽普渡一切餓鬼地獄畜生俾得無量無數餓鬼皆得來受甘露法味也中奉幽冥教主本尊地藏王菩薩其聯曰千座瑜伽唵啞叫高超薜荔衆三壇祕呪曼答辣供養須摩提又曰八難三途共入彌陀願海四生九有同登淨士運門又曰聞此法歡喜住於無疑者速成無上道與諸如來等又曰諸佛微妙音清淨如虛空明了一切行其心無所著其他奉有常住過去諸大德及十類含識等位香花普供滿排於前氣象莊嚴油然起敬由此內進巖壁有痕其狀如門再進稍寬其間有隙有石凳三石棹一空無所有其側有瑜伽泉蓋長老施設瑜伽普灑甘露之淨水也去須摩提國不數武有阿蘭若處此乃太虛大師民二十一年在厦為衆姓弟子宣講大乘本生心地觀經中有阿蘭若品廣闡出家比丘應如何往阿蘭若應如何受阿蘭若行等因此受感化而皈依大師者極衆遂有慈宗學會之成立焉阿蘭若處為蘇君慧純陳君敬賢居士等發心所築供養習禪定大心者清淨莊嚴幽勝殊絶誠為兜率陀院之最勝處也兜率陀院右有台一曰太虛台乃應城李居士基鴻所築為紀其本師太虛大師也民二十年李居士來訪偕登出巔一方石縱觀海山轉逢長老謂立此如在太虛間故名太虛台太虛大師有題巔曰海天曠覽又聯曰雲影波光天上下濤音松籟海中邊登斯台矣則羣峰環繞憑欄遠瞰風景在目歷歷可指大有唯我獨尊之慨矣同遊者信陽果地南安文顯諸友返時囑余寫筆記之以志不忘云爾民國二十二年五九閩南佛學院普照寺根源記覺斌普照寺之寺址據云在唐時由陳護法肇公布施之功德也肇公三世祖夷則公僑遷廈島聚族而居遂為陳姓發祥之地肇公因建茲寺而奉其祀於別殿後之僧追念首勞乃并肇公亦祀之蓋飲水思源藉報功德也施田五十有二畝為今寺址施山一隴即今所謂五老峯是也山之界東至仙姑嶺西濱海南水磨坑北界陳公墓林木之美山石之奇無以復加矣凡廈地來採材者間立券約寺僧收其息以供佛火僧糧及陳護法歲祭之需舊習遺傳相沿久矣逮至鄭公成功謀復明祚獨立台灣進兵閩浙駐節厦門訓練水師與滿清拒十有六年兵燹民散僧亦他徙寺之券約遺亡淨盡而護法之祀典於是焉而革時至今日山場寺址變更益多一被侵於自來水池公司再被劃入路政處之公路乃被盜賣於興業地方公司等遼闊之山場而被削去者十之八九矣山地乃寺址詳情見登記證明書余恐年深月久湮沒先進功德無以為後者勸茲特略志如是以為紀念云爾二二五三寫于庫房監院世三楹聯分派洛伽開法宇隔江太武拱山門林秉懋高氏勸娘刻陳衍撰書太武峙前屏塵世大千皆夢幻洛伽分一派法門不二此因緣高紅美高長源刻王振先書南望極滄溟波覆瀾翻何如獨坐蓮花真成自在普大蒙塵瘴煙迷雲暗安得同登寶筏託庇彌陀陳延祉黃鷲舍陳萬寶刻蔡秋濤題按琵琶弦彈破苦空色壳張蛟龍口吞來離垢珍珠蔣報察林蘇氏灑娘刻余煥章題手執金鞭降伏心猿意馬眼看寶座分明實相法身王子祿楊偉英刻劉培元題一佛南來天為洛伽開別島大江東去我從浮嶼望慈航謝春舍刻陳宗書題四大本無情隨循環桃紅柳緑翻新世界天王原有道護國土摧邪補正鎮定乾坤民國乙丑冬劉弘生刻吳清麟書昔日如來開教海今朝護法鎮禪林阮振昌刻柯題護世飛來多美膳法輪轉處現祥雲陳根陳刻沙門常惺題好摧外道歸調御應許將軍見太平楊家苗柯孝灶刻汪煌輝題怒目金剛任是千魔頓伏低眉菩薩由來萬行齊修葉階福等刻洪鴻儒題寶傘蓋張覆遍洞天福地青鋒劍利劈開愛鎖情枷何興化刻周殿薰題我是世尊使護持其法藏常在靈鷲山供養諸如來李玉樹刻南獄大雲書以上金剛寶殿聯經始溯唐朝與開元而並古普光被廈島對太武以增輝壬戌春晉江曾遒撰并書轉伴刻法界禮三摩天然鼓阜鐘巒為江上靈邱挂佛子開山杖錫戰塵昏五季留此雲巢石筧是閩南淨士護詩人題壁紗籠民國十一年首夏鐵彝黃仲訓書陳延社刻法身無去無來住寂光而不動德相非空非有隨機感以恆周民國第一壬戌六月阮隆記刻禪派即南宗笑指虎溪通呎尺法音超上品環看鷺嶼繞迦陵壬戌初春溫陵吳恭撰盥書鍾子才刻南海有名藍舶趕曾傳單舸去普天無淨土彌陀合共一龕藏莊泰芳文洲成刻閩縣陳培錕拜撰敬書佛國幾滄桑鴛舍重新瓜迹百年先靖海禪房繞水竹鷺江小住心香一瓣古瞿曇壬戌首夏溫陵施士浩鍾子才刻鼓震鍾鳴普醒衆生塵劫夢山明水秀全彰古佛法王身民國十一年夏月鐘添福南安黃培松現自在身願衆生共渡慈航早超苦海民國十一年孟春穀旦鍾亞春鍾寶金刻救將來劫望我佛宏施法雨力挽狂瀾海軍上軍劉冠雄敬獻紀合利刻丹鳳岡下建梵宮而水背山羅漢天然環佛地白鷺島中留勝迹左鐘右鼓觀音自在顯圓通民國壬戌夏季虎溪印月撰句并書紀榮利刻説法入三摩地右鐘三戒左鼓三明鐘鼓得六通共悟蒲團禪板登高到無盡巖觀海無邊觀天無際海天空萬象祇餘沙鳥水帆民國十有一年夏歷壬戌又五月穀旦思明縣知事來玉林盥手敬撰并書僧瑞梁刻此地為普照舊基經通侯改建茲山如洛伽妙境奉古佛慈尊壬戌春月晉江曾遒撰并書轉輝刻奚事相禪扉但有空門開覺路本來無壽相何妨五老踞靈山壬戌春月里人蔡鳳機撰并書歐安住刻五老小勾留巖壑常含無盡意百僧真供養澗泉那有不平鳴壬戌四月溫陵龔植張小良刻以上大雄寶殿四面石柱聯真觀清淨觀廣大智慧觀妙音海潮音勝彼世間音吳興王震書五老此留形清淨為心皆補恆普門無定相慈悲濟物即觀音住持太虛書以上大悲殿聯
