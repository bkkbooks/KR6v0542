昌佛學院研究生現廈門大學教育學院肄學校論理學國文常識教授雪生浙江本院肄業圖書管理員在此教職員表上本不可分為所謂第一任第二任第三任以本院教職員原無一定之任期也茲乃根據主持院務之中堅人上而假分之所謂第一任概指太院長未來院前常惺法師為院長蕙庭法師為教務主任之時而言此任期約有二年奇也所謂第二任概指太院長來院後由大醒芝峰二法師負責事務教務兩方面之時而言其任期約有五年奇也所謂第三任期概指太院長未退位常院長尚未繼任之前今年春由寄塵法師負責院務時而言此任期伊始至今始有半學期也以恐留心院情者對於任期說有所懷疑故特藉此聲明彌勒七儀每日上午下午及初夜共三次甲入壇三拜一南無本師釋迦牟尼佛一拜二南無十方常住佛學僧一拜三南無本尊彌勒如來一拜乙誦經念佛南無兜率內院佛菩薩三稱舉佛說觀彌勒菩薩上生兜率天經從如是我聞作禮而退接舉彌勒菩薩法王子從初發心不食肉以是因緣名慈氏為欲成熟諸眾生處於第四兜率天四十九重如意殿晝夜恒說不退行無數方便度人天接唱南無兜率內院一生補處當來下生彌勒如來接念南無彌勒如來五百聲或千聲丙囘向一歸位煞鼓二三拜囘向引磐舉南無彌勒如來當來下生願與含識速奉慈顏一拜南無彌勒如來大悲加持願資現身修增福智一拜南無彌勒如來所居內眾願捨命時得生其中一拜畢此三拜回向依玄奘大師令眾共稱之辭稍改而成自他現未心皆具足除此每日三時之外餘時則各人或拜佛或誦經或持呪或坐禪或禮懺或誦律以精進行持入壇三拜觀想曼怛囉出發於釋迦而歸宿於彌勒此為慈宗根本觀想必湏常常觀想使極其純熟隨處現前閩南佛學院藏書數目本院圖書向未捐募購書經費均由學院常費中按月抽出添購者以是之故藏書不多學科不備在所不免雖深知圖書為求學之淵海遇有因緣必須募置雖本院捌年來添購收藏為數不多然能增加至百分之九十有奇耳茲將本寺所收藏之書數目列表如下分類冊數價值頻伽藏續藏一一五四一四佛學五九八一八萬有文庫二五三六日文書二九一叢書一九六六九五史地一二五三二教育五八三科學一一三六哲學二八八七七文學六二四一一一美術二四一五四雜誌九四一八九總計七二七八三六二四四本寺佛學院之大講堂本寺佛學院之小講堂本寺佛學院學舍之西廊本寺佛學院學舍之東廊本寺佛學院圖書館佛學組之一部本寺佛學院圖書館世學組之一部
