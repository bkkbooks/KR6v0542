body:
  text: 教育閩南佛學院概况重編默如大醒法師在民國十八年七月曾編印過閩南佛學院概况一書茲因時間上又有四年之相隔故宜重編以其僅敍及十八年前之事也此篇雖以大醒法師所編者為藍本但不無稍有增定與刪削耳此為說明閩南佛學院概况重編命名之所以也廿二年四月八日默如附誌一本院略史南普陀寺原為子孫制之叢林自轉逢長老住持始改為選賢制之十方叢林時民國十三年也本寺選賢制中被選為第一任住持者為閩南僧界中富有聲譽之會泉和尚也明年適常惺法師在安慶安徽佛教學校辦學三年圓滿之期時民國十四年夏也閩南之廣津瑞徴二法師受學於安慶而歸來以閩南佛教道風雖善而研究教理者盖少乃與轉逢長老及會泉和尚等商榷提議創辦閩南佛學院事而轉會二公具有多年參學之經驗深悉時世之潮流非辦僧教育不克振興佛教故允其所請因而籌策進行航海致贄一夏之功瑣事齊備員僧薈萃一堂中元節後開學典禮推舉常惺會泉二法師為院長教務事務由覺三廣津等法師助理由此閩南佛學院得以正式成立也十四年秋本院開學後學僧得有七十四人籍隸江南隨常院長而來者居多自嶺南閩南來者僅少數且屬初小學級初分專修普通二部嗣為廣攝初機乃另闢小學一部此亦應機攝化耳十五年冬本院欲注全力於專修普通二部以冀速成乃將小學一部移至漳州南山寺開辦使之成為一獨立機關十六年夏會泉方丈三年任滿本院亦歲屆兩週兩院長商同各界舉太虛大師繼任本寺方丈兼本院院長專修部學僧畢業分化各地普通部學僧留院升學太院長進院後秋住院講學學僧雲集冬院長弘化他方以攝受學僧汎濫稍起學潮幸得院長遙相制止不致事態擴大終焉熄盡十七年春太院長派大醒芝峯寄塵三法師來院改組夏太院長赴歐美弘法寺務由轉逢長老代理院務由覺三法師代理並得大醒芝峯亦幻寄塵廣箴笑溪覺斌諸法師助理院務如修改院章整頓校規舉凡一切設備莫不兼顧冬太院長囘院講學學校氣象更覺活潑矣十八年春太院長弘化南京北平等處而寺務與院務一如其舊但本院設備方面如圖書館閱報室等逐漸增加完備以使學僧智識增長並得辦事經驗也秋學僧額數增至八九十名分為二級教授冬太院長囘院講真實義品由默如筆記院長又將本院英文成績較好之學僧提出另組一錫蘭留學團該團設於漳州南山寺並改南山學校為閩南佛學院第二院乃將本院丙乙二級一部分之學僧轉學於第二學院十九年春甲級學僧二十餘人畢業後設一研究部以為一部分畢業學僧研究深造之所芝峰法師為研究長大醒法師為副研究長由院長依畢業考試佛學筆記成績較優者選出寶忍寬蒼默如西蓮華清慧童戒德今懷心道道聞十人進研究部修學芝峯法師為之講成唯識論此外專修普通兩科一如其舊並注重日本本年四月太院長赴川宏法冬復囘院講學欲辭普陀主席不果二十年春太院長以佛學教授太少而研究部學僧成績尚佳即以研究員担任助教前後相繼担任助教者有西蓮寶忍默如戒德心道數人故院中精神依舊集中於專修普通之兩科二十一年夏專修科之甲級學僧二十餘名又行畢業典禮曾各作一篇畢業論文登載於現代佛教第五卷六七二期中藉此可見其成績之一班矣本年春夏二季太院長宏法漢口南京等處秋太院長住持奉化雪竇寺冬太院長來院與本寺兩序大眾商退住持及院長職通過後議請常惺法師繼任之並料理一切寺務院務不事稍懈院長又因會泉和尚等之情為厦門各界講大乘心地觀經又因潮州人士之熱烈歡迎往潮弘法一週又因厦門大學之請為之講法相唯識學概論由虞佛心居士筆記二十二年春芝峯法師去武昌負海潮音編輯之責大醒法師去蘇弘法太院長因厦門居士請組慈宗學會院長允許後乃為之講慈宗要藉該會並擬定整理慈宗典藉出版現已將太院長於民國十八年在閩院所講之真實義品印就並籌備將慈宗典藉搜集起來出一專刊名之目慈宗要藏二月初院長去奉化弘法本院學僧現在仍分甲乙兩班課程照舊本院事務教務概歸寄塵法師負責法師作事甚為謹慎焉本年夏常法師來院一方繼任普陀住持一方担任本院院長對於院務寺務當更有驚人之發展不卜可知常法師為現代新佛教中有數之人物對於佛學世學均有研究且素持宏法志願而在各處辦學均有甚佳之成績閩南風俗人情又極熟悉故知閩院將來之前途必大放光明於世界也二組織組織本院由南普陀常住全體組織關于教務兼指學院行政院長一職即由南普陀寺住持担任學院院務及一切應興應革事宜均由院長總理主持但得開教職員會議議决通過於院長不在院時院長職務則由副院長行使職權院設教務主任訓育主任事務主任各一人由院長聘任商承院長分理教務訓育及事務等事學監會計庶務交際書記圖書管理員皆由教務主任商得院長同意聘任之各科教師亦由教務主任與院長會商延聘如此在組織上有一系統在職務上各盡其職茲更列一表以明本院教職員之職權經濟本院經常費純為南普陀常住香火收入及經懺佛事之資充担因本院注重造就真實僧材常住雖多方節省對於額定之經常費亦必勉為其艱按月籌付决無妨礙本院之進行及十方來學學僧之修業或將來能得外緣之資助當更擴而充之以符本院造就僧寶弘法利生之宗旨院址本院院址即設於南普陀常住西部之一部自成院落外動內靜計有禮堂一三間講堂二六間教務處一二間事務處一二間圖書館一二間閱報室一印刷室一會客室一餐室一儲藏室一院長室一主任室一學監室一教授室會計室一庶務室一書記室一學僧宿舍二二十間大殿齋堂浴室等不備舉房屋舊式新裝光綫空氣尚都合講學之用三訓育本院因感現在佛教之不興乃由僧伽之少訓練故於訓育方針除行持修證外特別注重慈悲喜捨和諧合聚勞動勤苦訓練的目標在思想認識佛教為人生之唯一歸路認識佛教為指導民眾之佛教認識佛教應該為社會謀利作濟世事業打破一切封建思想根據佛陀的慈悲喜捨的精神建設適合時代及人生需要的新佛教行動養成有目的有方法有步驟的行動破除自私自利的安養尊榮個人的把持地盤寺院的惡習養成和諧合聚有紀律的團體即僧之義習慣生活革除舊時衣來伸手飯來張口之懶惰習慣養成一日不作一日不食勤苦的生活鍛鍊刻苦耐勞的體魄做我不入地獄誰入地獄的勞動工作本院訓練實施方法由學院方面指導的有談話糾正思想討論解决問題講演統一意志開會團結精神由學僧自動學院輔導的有同學問組織練習練習辦事講演會發揮個性的特長團體的結集四章程訂於十四年六月十七年修改第一章總綱第一條定名本院定名為閩南佛學院第二條宗旨本院以造成佛教住持僧寶弘法利生為宗旨第三條地址本院地址即厦門南普陀寺第四條組織本院設院長一人總理院務副院長一人輔理院務教務主任一人總理教務事務主任一人總理事務學監一人管理學僧交際一人內外交際會計一人管理出入銀賬書記一人繕寫書牘講義圖書管理員一人管理圖書庶務一人專辦一切雜務教授若干人分講學科第五條學額每級三十名三年畢業分申乙丙三級每年畢業一班第二章入學第六條資格須具有下列資格者為合格年齡在十八歲以上二十五歲以下者出家比丘沙彌具有真實求法弘法志願者曾在初中畢業乙丙班高中一年甲班及各處佛學院修學一二年以上或有同等學力者身體健全品行端方無諸嗜好者第七條手續報名時繳履歷書最近四寸科頭像片入學時繳志願書保證書及保證金十元第八條試驗入學須經過作文試驗口頭問答兩種試驗第九條保證本院為造就真寔弘法僧材起見入本院求法之學僧須有本院相知之諸方大德或佛教團體為介紹及保證者方可錄取即須有第七條之保證書第十條待遇凡入本院肄業者學膳宿書籍等費一概免收參考書目備并由本院每月津貼零用費二元第三章課程第十一條課程三級課程分三年教授一年級丙級讀第一學年課程二年級乙級讀第二學年課程三年級甲級讀第三學年課程科目分配如下表學年科目第一學年第二學年第三學年佛學佛學概論各宗派源流律學大意因明學概要律學大意俱舍學大意成實學大意四論學大意唯識學大意律學大意禪學大意淨土學大意天台學大意賢首學大意密學大意佛典汛論大乘宗地引論國文語體文文言文文法文學史語體文文言文文學史文言文文字學外國文日文英文日文英文日文英文數學算術珠算代數幾何三角歷史本國史印度佛教史本國史世界史本國佛教史世界史自由史觀僧伽制度沿革史地理本國地理本國地理世界地理世界地理佛教行化地域形勢科學自然科學社會科學自然科學社會科學自然科學社會科學晢學宗教心理學論理學中國哲學大要人生觀的科學西洋哲學大要印度哲學大要人生哲學世界各種宗教大要大乘與人間兩般文化教育教育原理教授法佛教研究法寺院管理法佛教教育各論三民主義三民主義仝上仝上藝術書法音樂圖畫圖畫音樂圖畫音樂梵曲建築雕刻體育體育仝上仝上行持布薩修淨習禪仝上仝上服勞體力工作仝上仝上附註上列科目每週教授三十六小時時間分配於每學期開學前配定惟每日有二小時修持上殿習禪坐香和一小時體力工作第四章學期休假第十二條學期本院以兩學期為一學年自八月一日至一月三十一為上學期自二月一日至七月三十日為下學期第十三條休假本院除星期日例假及寒暑假外佛誕日國慶日本院紀念日及各紀念日均休假一日第五章考試第十四條月考最月終舉行月考一次各學科均考第十五條期考每學期終結時舉行期考一次一學年各科考試分數不及格者降級或處罰或開除第十六條畢業每級學僧修滿三年各科成績分數及格者本院給與畢業證書畢業後介紹他方弘法或留本院供職或深究經藏第六章退學第十七條退學本院學僧有下列情形一條者即令退學不守本院一切規約者無故曠課在一月以上者疾病久纏難望卒業者有不得已事故陳請退學經本院許可者但已繳之保證金概不退還並得向該保證人追還膳費第七章附則第十八條附則本章程如有未盡善之處得由院長召集教職員隨時開會酌定修改之五規約共住規約第一條本院以修學佛乘自覺覺他為宗旨故職員學僧皆宜恪守各項規制不得故意違背紊亂秩序第二條學僧除課外不得干預他事第三條院內一切器具及牆壁玻璃門窗等件務宜愛惜保護不得塗抹損毀違者照價賠償第四條各室內有人談話不得在門外窺聽第五條無論何人之物非本人許可不得擅自攜取第六條如拾得遺失物當須送交學監懸掛招牌不得私自收藏第七條學僧遇院內夫役失禮可告知學監檢察呵責不得逕與爭論第八條學僧在院開會須事前呈請本院長及教務處核准後方得集會第九條凡學僧不得在本院內張貼一切說帖縱有遺失物件等物亦須告知學監代為宣布查追第十條凡他人信件不得折視第十一條學僧每班公舉班長一人副班長一人其責任如下代表同班諸人陳說事件及傳述事件於諸同班糾正同班諸人違犯規則之舉動班長告假時副班長代負責任第十二條每室公舉室長一人其責任如下代表同室諸人陳說事件及傳述事件於諸同室糾正同室諸人違犯規則之舉動同室中人如有疾病應即報告學監第十三條班長室長為同班同室之表率當恪守規則為眾矜式若能一學期內勤慎無過即記大功一次如違犯規則如至記大過一次或小過二次者則將其班長或室長取消之第十四條每學期本院示期開課學僧皆須即日到院不得遲延除有特別事故經本院先時特許者外遲至十日以上即行開除並追繳學膳費第十五條每學期放假前除確有特別事故經本院特許外雖試驗已畢亦不准告假先歸第十六條凡本院舉行祈禱開學放假紀念等禮式學僧均應列席不得缺席第十七條凡學僧有銀錢及貴重等物須存會計處掣取收條隨時取用否則如有遺失本院概不負責第十八條凡學僧如彼此有糾慕時須向學監陳述情由判斷之不得逕自爭論甚或至於鬥毆第十九條學僧之剃沐洗濯事宜均由本院於例假日行之第二十條本院學僧非學監許可者不得留客食宿第二十一條凡學僧外出須着長衫并佩帶本院徽章於胸前禮堂規則第一條凡聞集眾鐘即入禮堂第二條在禮堂中坐立皆依一定位次第三條在禮堂除禮拜持誦并繞佛坐禪外不得談笑遊戲第四條遇休息時飯畢時得於禮堂中徑行或靜坐第五條禮堂中不許隨便吐痰講堂規則第一條須按編定名次就坐不得紊亂第二條各按鐘點上課不得無故缺席第三條上下講堂須依次進出不得擁擠喧嘩第四條衣履概須整潔雖當炎暑亦湏著長衫不得袒胸跣足第五條入堂不可在教員之後出堂不得在教員之先第六條教員上下講堂時須起立合掌對在家教員鞠躬第七條凡質疑或應問均宜直立而言第八條教員講輟時不得參問他事第九條不得越席耳語第十條除應用書籍文具外凡一切玩物食物及與所授功課無關之書籍均不得攜入第十一條各人所用書籍文具下課時宜各攜歸不得任意拋棄第十二條上課時須端身正坐不得有各種倦容第十三條凡有來賓參觀仍須疑神聽講不得游目囘首致亂視聽第十四條除痰盂外不得隨意吐痰第十五條每講堂按坐次輪派值日僧督令夫役打掃潔淨并隨時揩抹黑板自修室規則第一條聞鐘聲即應入室練習功課不得缺席第二條至自修室中無論何時不得任意談話第三條用物文具務令整潔不得雜亂無章亦不得侵佔他人位置第四條凡無關於自修之書籍物件不得攜入寢室規則第一條凡上課食作時須將各室鎖閉第二條凡一經住定即不得任意遷移第三條室內被褥衣服書物等件宜勤加洗濯整理不得任意堆置第四條室內燈火一聞寢息鐘即須息滅齋堂規則第一條食時凡各班出堂依序次以入齋堂不得任意而入第二條各依所編位次入座不得凌亂次序第三條坐定時先供佛施生畢方就食各宜威儀肅靜不得談笑旁視第四條行堂添飯添菜應依次聽糾察招呼學僧不得出聲叫喚第五條食畢聽糾察招呼誦飯訖偈已乃依次出不得前後擁擠圖書舘規則第一條無論教職員學僧欲借書閱看須先向管理員開明借書簿然後領取於繳還時即將原字取銷但簿內須書明姓名及住室號數等以便清查第二條每次取書以二冊為限繳書以一週為限如過期未繳營理員得執條向其索囘第三條凡借閱經藏者倍宜珍惜不得任意批評點竄如繳還時查有汚損痕跡須遵原定價值償十分之二若有殘失即全部照原價賠償第四條外來客人欲借閱經藏者須經院內各教職員之介紹亦須遵守本院所定規約門禁規則第一條學僧出外時非執有准假名牌不得逕出第二條學僧歸時非取去准假牌不得逕入第三條凡來賓須請其填明會客單方能招待入會客室第四條來賓會學僧者非本院會客時間概不得延入會教職員者不在此限會客規則第一條每日定中午十二時至十一時及下午四時至六時為學僧會客時間第二條凡來賓有欲參觀本院者須先由學監延接不得隨意游覽並不得引入自修室或寢室第三條會客談話不得高聲告假規則第一條因疫告假者須有本院醫生證書第二條告假外出時須往學監處陳明事由若學監不允不得外出如經允許則將限定時間書寫簿上並將准假名牌執交司閽始得外出星期日亦同第三條非有確實證據經學監允可者不得在外寄宿第四條告假在外不得為種種不名譽之事第五條不得逾時不歸勸懲規則記功第一條於各功課能勇猛精進者第二條修持能為同學之表率者第三條各班長室長能將本班本室之規約切實整頓者以上記大功第四條凡一月之中不缺一課者記小功記過第一條未經學監允許擅在外寄宿者第二條不遵教職員之教訓者第三條於功課慢不用心屢誡不悛者第四條出外不請假者第五條不遵學監之管理者第六條私折他人信件者第七條侮辱同學及對於外人有粗暴舉動者第八條本院一切公布及功課表任意塗抹者第九條不守規定時間逾十五分鐘以上者第十條請假歸院逾限者第十一條自修室或寢室未經學監允許擅自遷移者第十二條在院私自飲酒吸煙者以上記大過第十三條未經准假而缺席者第十四條失禮儀者第十五條對於同學或外人高聲爭嚷者第十六條在院宇門牆上塗抹刻劃者第十七條門外竊聽他人講話者第十八條拋棄汚穢物於各處者第十九條使喚雜役高聲或大呼謾罵者第二十條紊亂講堂或自修室或齋堂之次序者第廿一條未經學監允可早晚點名不到者第廿二條借閱圖書不遵規約或塗污損壞者第廿三條未經學監允