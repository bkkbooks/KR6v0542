body:
  text: 法物一法器坐像玉佛三尊高二尺二寸係清光緒年間大美國海軍某炮艦艦長由南洋請來贈於本寺供養者臥像玉佛一尊長四尺五寸係瑞等師由南洋請來供養年月日莫詳瑞師今人遠在南洋銅佛三尊高五寸係坐像寄存庫房中大鐘一口銅質高八尺口面四尺五寸係清康熙四十二年春王月欽差督理福建沿海等處稅務內務府會計員外郎兼包六達巴諱蘭泰同衆建造本寺開山比丘露踪敬募銅磬一口高一尺二寸口面一尺三寸民國丁卯年本寺大衆發心敬置銅爐一個高八寸口面一尺民國十六年趙門范氏莫門陳氏同敬楊木如意一把係本寺住持太虛大師於民國十三年代表中國佛教徒出席東亞佛教聯合會於日本東京芝公園增上寺某日僧敬贈者本質良美雕刻精緻洵非工業後進國家所能望其項背也又木如意一把年月日莫考七佛塔一座銅質七層高七尺五寸層層均供有佛像故名之係民國二十一年鼓浪嶼黃秀烺先生之夫人陳女士贈於本寺保存供奉者其夫黃君係古懂商見塔銅質良美雕刻精緻以五百金購之愛如珍寶其夫人因同安林鏡秋先生之勸割愛布施敬奉寺中令大衆禮拜瞻仰普種福田誠屬功德無量也二書畫飄海觀音一軸李唐吳道子畫民國二十年莊文州先生贈於本寺供奉墨色精美筆法生動洵非近代藝術家所能望其項背也墨拓嶽陽樓記十二幅張照書泉州周伯遒先生贈莊俊元墨書屏四幅虞亭之墨書屏四幅章太炎篆書聯一付王震行書聯兩付三石刻石林每字高一尺四寸廣一尺二寸嘉慶庚申年白慶徠題鐫祝國佑民每字寬廣約一尺甲辰年蓮臣通慧書篆字同治己巳年重修御碑亭南普陀李成謀曾憲德敬修馬琛曾文章刻碑文同治十三年禮陽孫開華刻碑文民國紀年五月無錫王蘊章記晉安蘇明書篆書四字每字高二尺廣一尺五寸光緒辛巳楊浚書美國海軍提督贈銀杯文光緒三十四年十月六日又宣統二年再志重修南普陀寺後迎勝軒扇亭記咸豐十一年辛酉十全堂公刻洗心每字高一尺七寸寬一尺一寸道光七年丁亥刻飲水泉每字高一尺七寸廣一尺五寸道光七年昭萍劉鐸刻南無阿彌陀佛太虛書會泉刻海上神山每字高三尺二寸廣二尺八寸雲山張大河題天南鴻雪每字高一尺四寸廣一尺林順吉刻美國太平洋三十五商會代表團偕美領事遊志宣統二年九月十七日葉崇祿記山深水峙海濶天空每字高廣一尺民國四年鄭乃深題人在蓬萊第一峯宣統紀元張煜南題三生石每字高廣一尺八寸甲辰年通慧書心鏡刻五候官爰步陋室銘體志文民國二年劉以臧刻海軍提督薩鎮冰奉命復興海軍勒文宣統紀元馮恕察書五老峰每字高二尺廣一尺八寸民國九年黃仲訊書佛高一丈四尺廣一丈光緒乙巳年振慧書漱石每字高廣一尺二寸民國乙丑年人題石荷每字高廣二尺戌午年童保喧留題登山南陽每字高廣一尺六寸頂門隻眼每字高廣一尺六寸民國十九年太虛書轉逢刻兜率陀院阿耨達池民國己巳年太虛書覺心源民國十八年太虛書轉逢鐫須摩提國每字高廣一尺六寸太虛大師詩南普陀鐫憨山大師警世詩歌光緒丙午年晋江曾遒書太虛臺每字高廣二尺民國二十年一月李基鴻題杯濱書阿蘭若處建於民國二十二年位於須摩提國之後太虛大師題
