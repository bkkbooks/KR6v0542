body:
  text: 列傳小引本寺肇自唐宋其間興廢不一其沿革已誌本寺寺考茲不多贅惟本寺自開建以來代有德僧職僧應化於其間或以道德為人所景仰或以辦事勤敏見稱要皆為法門之龍象而本寺興廢之關鍵係焉同人以其功績不可掩沒爰將本寺過去現在之有功行於常住者而分為德僧職僧二類梗概略述而現代有力之護法居士亦興焉一德僧本寺開山慧日臨祖老和尚喝雲堂上景峯先祖老和尚重興本寺德隆己祖老和尚本寺堂上真衷老和尚本寺堂上真和老和尚喜參和尚略傳高文顯喜參和尚者重興本寺之德僧安徽池州府青陽縣人也幼遭洪楊之亂避難流落閩厦寄身梨園頗有聲望雖在歌舞聲色狗馬貨利之場然常具超塵絕俗出世之念所謂蓮花之生於汚泥而不為其所染高潔獨芳超凡入塵證之于師而益信矣苦海無邊囘頭是岸如師者勒馬懸崖勇毅過人與彼沉淪生死海中被聲色所迷之苦惱眾生豈可同日而語乎故師嘗在演劇中因披袈裟即動出世想蓋悟人世之悲歡離合苦樂無常與劇中人之變幻虛假莫汕同為一轍也於是奮袂而起往南普陀寺依佛日和尚座下脫白披剃焉未幾往漳州南山寺受具足戒且親近佛乘和尚參究向上事一日正隨和尚挑瓦礫和尚以槓擊之曰是什麽耳曰不會和尚再以石子投師前呼曰取來師拾起呈上和尚曰不知本來面目爭得恁麽來言下大悟禮謝曰乘師直指授豈是舊時人從此力行師道徹究禪機四眾弟子皈依日眾以此因緣重光南山聲譽遐邇斯時也厦地紳商聞其道風函請住持鴻山寺師以眾望難却慨然允許駐錫未久恢復舊觀遜清光緒二十一年接住本寺百廢俱興法雨普施法幢高建諸天歡喜僧俗同慶如今之閩南佛學院學舍講堂秩序整然明窗淨几花木陰翳諸師千里雲集聚會一處講於斯學于斯深究如來大法得無風雨之慮棲身食息如入寶所佛教佛化光芒萬丈嗟呼此誰之賜乎誠參公德澤所加庇也此外如本寺之祖堂亦師卓錫時所建至今完整巍然獨峙師之勞苦功莫大焉師住持本寺以來除應興應革整理建築外而維護佛教續佛慧命方便利俗普濟羣生亦師之素願也如辛丑冬恭迓浙之天童淨心和尚來厦宏揚戒法壬寅再度開堂傳戒本寺道風於斯益振厦地長官達士信男善女聞風景仰皈依尤眾如當時厦門道劉慶紛及其夫人皈依座下一時傳為美談足見師之慈悲為懷濟世利物感人之深矣師自得此無上法緣後益力行佛事衞教之心更熱吾嘗聞之於吾母云喜參大師者德高望厚之高僧也嘗創辦念佛堂及佛化小學等一時學者雲集甚眾而平居關心佛教之盛衰甚切曾聞泉之安海龍山寺被新學暴徒侵凌霸佔師聞之大憤奔走各方遊說當道棲棲徨徨席不暇暖後卒得其弟子劉慶紛之力特派幹員前往調解寺囚此得安甯而不損其毫末師之力也據此亦足見師衞教之熱忱與夫維護佛法之一班矣師享年六十有四圓寂塔於本寺開山塔之左寺董劉君培元曾有喜參大師真像讚茲附錄於此以見當日之盛也讚云猶是官骸師胡為名為大猶是面目像胡為號以真蓋由渾亡四相斷絕六塵三心既了不可得五蘊亦殞於無垠所以即空即色即藐即神禪關三載閉來清修默默戒座兩期登去大誨諄諄此其主席普照佛光重新春風寫影秋月結隣人第觀其表正形端乃高僧之垂範我深識其情忘性空寔菩薩之現身二二四一九菩薩戒弟子高文顯謹傳于廈門大學轉逢和尚事略自述寄塵記一略敍出家因緣余本省泉州南安縣人俗姓王兄弟三人余居次也余父諱亦堆母胡氏均以忠厚見稱於鄉里而余之父母亦以長齋奉佛自勉焉余孩提之時夜間嘗夢紅日如大蓮花先彩奪目備極莊嚴覺寤後陳稟父母父母喜甚因字余曰臥蓮盖陰許余對於佛門有大因緣故也自此以後隨父母菇素奉佛信心决定年十二見長兄為僧羨之稟之父母求為僧許之至是即隨長兄往小雪峰寺而度其善男子之生活矣小雪峰泉之有名古剎也歷代住持高僧輩出如義存禪師在禪宗中所負之聲望可以窺見一班矣雖去聖遙遠獅絃絕響發心利生代不乏人余初到雪峰寺時為該寺住持者則為佛化老人佛化老人之道德久為泉屬僧俗作大皈依處矣余見面時即蒙老人開示云凡軀能滅其中有不生滅之佛性在了解得此義方可為僧汝了解否余應曰了解老人歡喜授余一偈曰端坐念佛意新新寂寂虛虛淨無塵六個門頭光燦爛通融法界本來人余自得此偈後參禪念佛修持不輟焉余在俗少讀書既入佛門除修持操作外學經習字日以為常今日稍有成就完全得力於佛化老人也二具足戒後參方年十八依喜敏大師脫白披剃焉取字轉逢號海妙廿二歲詣本寺厦門南普陀寺具足得菩薩戒位遜清光緒卅四年行脚參方初於浙江甯波之天童寺天童寺乃三江禪宗之巨剎密雲祖師道場也余住禪堂時在冬期打靜七僧極眾一日堂頭和尚八指頭陀開示至阿難拖死屍句又云個物非仙亦非佛運用體如如言下默然有省嗣後身心輕安得未曾有次往江蘇鎮江之金山江天寺江天寺亦三江禪宗之巨剎佛印禪師道塲也余住禪堂至冬期打靜七一日晚往齋堂吃點心粥到齋堂將坐未坐時一念之中忽然山崩地裂虛空粉碎幾有大地平沒之概余甚異之而余之還大包孜錢亦稍有把握也次往維揚三汊河高旻寺親近赤山老人焉高旻寺亦為三江禪宗之巨剎玉琳國師通塲也赤山老人參破黑漆桶大智慧人經文不識侍者誦之即就文柝義罄無不盡雖老師宿儒莫敢抗衡如過去之月霞諦閑慧明諸法師皆出其門下余得親近何幸如之余住禪堂打靜七到第三個七期中忽而心行道絕無功可用幾天不睡寂如枯森越四日午板香時睡魔壓逼幾不能支當下慧光一照當體皆空所謂本來無一物殆即是歟余於是請老人開示印之云汝若真是作如是不愧禪堂苦漠兒塵按此苦漠兒廢解或枯木兒之誤乎嗣後行脚常州天甯寺天寺亦為三江禪宗之巨剎也財產之富甲于全國近聞坐香廢馳日趨應赴佛門不幸一至於此余住天甯寺知遇於前住持冶開老人授以知客僧值各職服務常住於是一片閑雲為之留住自此以後凡江浙之大叢林者多以首領職事相授而余之發心開創叢林整理寺規亦自此為鵠始矣三接住南普陀寺民國九年往禮山西五台山晋謁文殊菩薩後囘住北京即今之北京本寺當事人派代表往京邀囘任本寺住持職務因為道場關係未便峻拒即隨代表陣同返厦在當時本寺不過為一子孫小廟荒凉滿目令人悽慘不禁余乃斬伐蒿萊糞除瓦礫香火日盛住僧亦多繼思十方常住栽培恩廣即將本寺改為叢林實行叢林制度如上殿過堂坐香念佛打七均實行焉雖然一人做事頗覺吃虧至民國十三年大殿及兩旁走廊鐘鼓樓等工程告竣而余之心力亦為之交困矣於是設訂十方選賢規約二十則呈之政府立案以為永遠法制一掃諸方之子孫制及法制之流弊也本寺雖由余整頓改為十方選賢叢林而贊助成為事寔職事大眾亦有力焉本寺自改為十方後本寺之發達邁進亦為前所未有也本寺改為十方第一任和尚則為會泉法師有傳另錄自本寺和尚選出後余即交待清楚囘泉小雪峰寺整頓祖庭藉報祖恩民國十五年冬往漳州南山寺未幾沾病返廈住養真宮養病就醫焉一日晚夢見一金人身長數丈垂手立於海中神彩煥發光芒萬丈驚醒病愈民國十六年春因本寺改選太虛法師為繼任持有傳另錄余代表常住往滬勸駕於是又返本寺襄助寺務矣六年以來雖無所建白然寺務院務力求整治或可差強人意耳四余今後之願行余在民國二十年元旦在須摩提國中設壇主施瑜伽千座藉以利他亦以自利須摩提國本寺之後山巨石雲木中初因本寺飲料水源常威缺乏闔寺大眾時以為愛有某師採藥山中見石壁下有泉水流潺潺頗以為異掬而飲之味甘而冽喜極走告余余隨往探究竟見源顯活水來頗合衞生因勢鑿池蓄水儲之而本寺之飲料前感困難者今得以解决焉余因此築石屋于池上面凡三所曰兜率陀院曰須摩提國曰阿難若處地勢清幽迴少塵囂外護蘇居士慧純陳居士敬賢蔡居士吉堂林居士鏡秋時過論道倍覺生色余因前在湏摩提國中設壇主施瑜伽千座二年以來功德圓滿自利利他獲益良多余今後之願行唯此法門認真做去但願所有功德回向法界情與無情同圓種智耳民國二二四六于閩南佛學院會泉和尚傳默如會泉和尚別號印月明性為其名俗姓張福建同安人也童年多承母訓因其年方七歲父即西逝故惟母是所依怙至年十三乃覺人生於世生活問題由自解決方不失其獨立之精神於是立習商業以逞其志耳至年十四忽遭不幸母亦棄世由是囘想起來父母相繼去世前後未及十年甚感世相既如此無常如此幻化則人生之意味甚寡終難避免死之一途既而因覽岳傅審悉忠孝確為人之根本然往往事實與志願相悖因環境之阻礙遂不能達到目的由此厭世觀念頓生出家思想漸萌至年十九毅然出家遂投於虎溪巖善温和尚座下落髮而為僧矣然此僅具僧伽之形像尚未獲得僧伽之精神僧伽之形像者身著圓領方袍也僧伽之精神者依佛戒律而實行也故其年滿二十乃受具於漳州南山寺學公和尚此為會泉和尚出家與受具之因緣也受具已後已知戒律固為僧伽身心之軌範然欲煉一純善之僧格及一有用之人材則非修習禪定與研究教理不為功和尚本此自利利他之宗旨發起無畏精神百折不撓效玄奘之西遊學善財之南詢誠可欽仰茲略述其參訪知識之經歷即可見其精進之一斑矣和尚二十二歲航海至浙省之天童寺聽諦閒法師講法華經同年夏復遊南海聽幻人法師講法華經廿三歲復囘天童聽寒橋法師講楞巖經同年冬進禪堂練習禪定二十四歲聽天童延請之幻人法師所講之楞嚴宗通經期畢後常州復請幻人法師講法華經乃又隨之而去聽講二十五歲夏遊焦山聽通智法師講楞嚴經冬進住高旻禪堂二十六歲冬至金山進大禪堂習定二十七歲春至大通和悅洲聽月霞老人講楞嚴經夏來天童聽通老法師講楞嚴經冬進禪堂打七二十八歲復回本省至廈門南普陀寺襄助淨心和尚代參老和尚傅戒二十九歲住泉州小雪峰親近佛化法祖殆有三載祖示以禪宗法語云剔眉露出通天眼返照身心練是空由是和尚了知楞嚴經中指見是心之語亦不可得也卅二歲再至天童聽道階法師講便蒙鈔及唯識三十論三十三歲與太虛大師同住天童聽法華經同年秋至泉州承天寺襄助啟建水陸道場以作冥陽兩利之法事和尚受具後之十餘年來皆度如此之雲水生活飄零他方行踪無定由福建而浙江由浙江而江蘇由江蘇而安徽往來循環不暫停息然而身體安泰精神舒適一瓶一鉢足以維持生活三衣隻具亦能到處安身雖則備嘗艱辛屢遭挫折而和尚胸懷坦白無事自若以其另有精神上之安慰故也其安慰為何受善知識之熏習如飲醍醐得大導師之開導若被甘露孔子之所謂發憤忘食樂以忘憂者是也故其終能造成閩省僧界中之一翹楚人物古人云不受一番寒徹骨那得梅花撲鼻香其斯之謂歟此為會泉和尚參方與學道之經歷也受此一番辛勤知識既富矣而道德亦宏且大矣於是聲聞國內名播十方尤其閩南人士莫不非常敬重之愛戴之景仰之擁護之而和尚亦本其愛己愛人愛教之熱忱以從事於化導社會宏揚佛法之工作而不稍懈焉有人請其學術演講者則演講之有人請其通俗布教者則布教之有人請其主席叢林者則主席之有人舉其領袖僧眾者則領袖之和尚畢生事業不出於此其他叢林中之上座大德惟以幽閒生活是務安樂自在為圖較之和尚不亦霄壞乎然則和尚宏法之歷程又為如何歟茲請述之和尚三十四歲因受泉州小雪峯之請講楞嚴經三十六歲囘虎溪巖靜修三載三十九歲因受台灣人士之請而講經四十三歲主席泉州承天寺弘法數年五十一歲主席厦門南普陀寺創辦閩南佛學院五十四歲退院請太虛大師主席五十五歲至台灣講經五十八歲於承天寺講楞嚴經五十九歲於虎溪巖再講楞嚴今年民國二十二年六十歲於萬石巖新建佛學研究社以領僧眾從事於佛學之研究今後於佛教之貢獻於眾生之利益當不可限量茲者不能預記且止於斯此為會泉和尚弘法與利生之概略也道學兼優固為人所尊敬恭養而會泉和尚之所以特為閩南人士謳歌讚歎而不已者蓋必有其因緣也按余所知者約有兩點即一和尚布教與演講之方法尤其通俗演講人皆曰善其口詞之鋒芒銳利者足以使懦夫聽而精神卓立也其理論之切實誠懇者足以使頑者聽而態度潔廉也其布教時往往一般人民甚或一聆法音頃刻滿目中之淚珠汪汪霎時心理上誠意懇懇於是油然而生起皈敬三寶之觀念其說法之動人有如此者故閩南人士頻延和尚說法而和尚亦不憚煩慳悋法施所謂遇緣即應是也今之閩南人士信仰佛法有如此之眾者未始不由其說法之力所感化也二和尚住持南普陀尤其創辦閩南佛學院人皆曰善蓋佛教在近十年來如在風雨漂搖之中內部不振大有死氣沉沉之現象而外界因之蔑視與欺侮甚至覬覦寺產提倡撥出以充教育經費故和尚自主席南普陀以來本其關心中國佛教前途之旨乃商榷於本寺轉逢和尚創辦一閩南佛學院以育僧材然此教育之經費並無恒產可恃即以香火收入勉為其艱由創辦以來至今未告暫停誠為中國僧教育機關中之首屈一指矣於是僧材輩出僧格提高社會人土亦因而改其鄙棄之態度而敬之愛之之不暇矣而吾人得受僧教育之訓導者未始不由其提倡僧教育之功德也此上二者不過就其大者而言之其他小節不勝枚舉姑止於此耳至其將來之歷史雖不能預記想於佛教必更有驚人之發展矣民國一十二年四月五日作於閩南佛學院三友樓太虛法師略傳寄塵佛教新運動領袖太虛法師年四十一浙江崇德人俗呂姓弱冠即皈依佛門年十八間教於八指頭陀道階法師習天台賢首宗之教觀次年閱大藏經苦心靜研頓從般若經豁然大悟諸法之實相年二十即創僧教育會於天童寺為其事業之發端次年從楊仁山居士月霞諦閑二法師遊旋任教於普陀化雨學校年念二被舉為廣州白雲山雙溪寺住持遂辦佛學精舍於獅子林同著作佛教史諭多種次年以革命嫌疑返滬旋民國政府成立於南京乃創中國佛教協進會於毗廬寺南北統一即合併於中華佛教總會又推為佛教月報總編輯真如福音由是播世道人心由是正民三訪依了餘和尚與印光法師遊潛修於普院麒麟禪院習禪定淨業研究法相唯識律藏密宗諸經造詣極深並涉覽諸子百家古籍及近代西洋哲學宗教新書歷民四而至民五在其靜修中有論神教論天演化論周易論墨學論荀子及哲學正觀教育新見佛乘導言大佛頂首楞嚴經攝論整理僧伽制論等著作而完成其思想之正統民六普院出關後漫遊日本台灣暹羅緬甸錫蘭柔佛等處於是確立其以佛法改善社會進化人羣之志次年與陳原白王一亭等設覺社於上海辦叢書季刊以導揚文化糾正人心其影嚮所及各省遂有紛紛之居士學佛團體出現民八請講維摩經起信論於北平聽講者多為一時名流學者可謂收歷來法會未有之功民九任杭州兜率寺住持辦海潮音月刊又往武漢廣州講學設立佛教會於漢口次年住持西湖淨慈寺又被邀講學於杭州北京等處而宣傳佛學救世主義推行更廣民十一講學漢陽歸元寺而創辦佛學院於武昌青年緇素來自四方者濟濟一堂研習學理精持戒律為一時之冠近年來種種佛教新運動莫不以該院之學者為其主幹旋又被推為湖南溈山之住持以一人而同時長持多種團體勞心勞力於此可見次年又創立蘆山大林寺重新古代道場復籌開世界佛教聯合會於該寺以期今世界佛教有闊大之組織民十三暑時住開第一次大會被舉為會長旋又講學於泰縣光孝寺江北之僧伽居士慕名往聽道者踵相接民十四又講於北京甯波上海居士林等處是年夏曾代表中國佛徒出席日本之東亞佛教大會次年又被邀講學於南洋新嘉坡與廈門南普陀并設佛化教育社及佛教通信社於滬東雪竇寺民十六春乃創辦上海法苑旋又被推為本寺住持并兼任本寺所辦之閩南佛學院院長本年秋被請為亞細亞大學委員及德國中華文化學院董事因念國府新建都於金陵訓政伊始各種政治漸趨正軌遂於去秋發起全國佛教代表會議設立中國佛學會籌備處於毗廬寺以期中國佛徒有嚴密自治之機關十七年八月十一日起程赴歐美宏法為我國佛法傳到西方之第一人有特集各界同志其餞歡送於海上之滄洲別墅編印特刊攝影以壯其行色歷經法比荷德英美各國到處備受友邦學者歡迎報紙雜誌皆紛載其言行喚醒世人迷夢甚眾歐美人士對東方文化信仰深切各大學各學會見師光臨咸紛請演講應接不暇東奔西走勇猛精進誠為常人所難及勤習武當太極拳之效在法時曾與各邦哲士發起世界佛學院於巴黎大學設籌備處并有信士慨捐鉅款美的以促其早成可見碧眼兒為善之心亦不亞於國人也於十八年一九二九年名女子今秋還有坤村主義發明家劉仁航博士將赴歐美從事世界女性和平運動以繼法師之偉舉勞働節歸故里四日應上海各界同仁歡迎大會於報本堂下院報告出遊八月宣道經過及歐美人十對于東方文化之態度藉資同胞觀感時已被推為中國佛教會常務委員又往杭州九華安慶武昌長沙各處講學十九年春往福建講學夏往四川各處講學并在北京居士林講法與朱子橋居士及台源和尚常惺法師等就柏林寺立世界佛學院設備處二十年春返厦門本寺講演夏往北平應中西各會之請講佛法是年十月應陝西佛學界之請往陝宏法并在大慈恩寺成立慈宗佛學院二十一年春在南京佛學會講法夏往四川組織漢藏教理院秋被任為奉化雪竇寺住持旋返厦門本寺及廈門大學講法冬往油頭佛教正信會講法旋返厦門本寺講大乘本生心地觀經全部二十二年二月往奉化雪竇寺講法余忝列其門下佩偉其志力謹為述其生平之事略以告仰慕大師之為人者附註本傳多取材於海潮音及黃警頑先生之太虛法師小傳特此聲明以免掠美之嫌民國二二四八于閩南佛學院二職僧轉道上人傳寄塵釋海清上人字轉道福建晉江縣桐林鄉黃氏子也父依汲公母呂氏上人年十一時父病甚篤輒思兄弟六人已居其季倘父有不測將何所倚遂默禱菩薩冀垂侑焉精神所感金石為開於是在夢中見一老人指示云汝能持齋父病可痊因即發願持齋父病因此旋愈異日設餚父命食肉不答父怒上人長跪白以前因父聞而感動遂使全家素食焉年十三聞人演六祖壇經心甚喜即往南安仙跡巖充當飯頭明年赴海澄大巖親近喜敏上人聽講法要年十八除夕日聞母讚美出家好乘機請命母喜次年正月同父並眾善友赴漳州南山寺禮喜修大師為本師二月十九日脫白披焉五月母逝奔喪如儀旋父病八月方痊同喜敏上人往雪峯路至嶺兜石室巖患吐瀉甚劇夢中見彌陀示現金色身伸手三摩其頭驚醒遍身汗出病雖少安舉步維難雪峯之行未果十一月往漳州南山寺求懺摩具足得菩薩戒位明年四月二十五日本師西歸喪事圓滿乃往雪峯聽講至見見非見見非是見見猶離見見不能及有省旋囘梓視父病六月十五日父歿喪事盡哀由是往外參學鎮江金山寺禪堂忍而不退更往揚州高旻寺深造焉行之三叉河邊雪月皎皓妄心頓歇次春因胃病發願朝山五臺峩嵋敬禮多次還住天童後逢喜參和尚傳戒於本寺為請高德八人返廈隨喜戒期畢引住漳州萬松關瑞竹巖及厦門金鷄亭心甚不安旋往金山高旻等處坐香因喜參和尚閉闢催其返夏襄理寺務遂發心建築放生池池功告竣退住養真宮一心參研不理世緣遜清宣統二年雲南虛雲和尚來厦欲往北京請藏以無熟人邀上人同往請藏囘滇虛公感甚民國二年擬往雲南靜修過星洲之金蘭廟因徒姪與劉金楞爭地戲言汝二人皆不必爭可將地布施於我建寺供佛作大功德二人應允遂同瑞等轉岸二師商建殿堂至五月成功以逐年儉積鉢資期建一大叢林適轉物和尚南來時述及泉州開元寺為閩中一大道場邀其共興開元寺旋與轉物和尚於年九月十二進院十五日桃開紅蓮見者聞者皆詫為千年未有之瑞相也去年正月一日所住星洲之天福宮亦嘉禾獻瑞開元中興此非先兆乎今開元寺由上人罄出其所積鉢資鳩工整理煥然一新請轉物和尚住持並設有慈兒院以廣行佛化此上人自度自人之德行洵足以繼往傳來者也上人在本寺有大功行焉且請為座元要職茲略敍其生平以誌不忘云爾民國二二四七于閩南佛學院轉塵上人傳高文顯釋轉塵字海淨泉州南安黃氏子也品性忠厚人所不及中年視世路崎嶇人心濁惡汕然作出世之想乃投喜靜禪師為師受具足戒於自是力行佛事精持梵行歷任本寺監院與瑞等諸師共謀重建大雄寶殿等十餘年來服務佛教未常稍怠足見其忍苦耐勞之精神為佛教而犧牲者大矣上人現任泉州承天禪寺住持創辦佛學研究社造就僧材弘揚教法亦僧界中不可多得之大德也二二四二二寫於厦門大學覺三法師小傳寄塵釋覺三字契林湖南衡山石灣劉氏子也年十九遊岳訪仙至祝聖寺遇妙觀上人契之遂投座下脫白披剃焉未幾往南台懺摩具足得菩薩戒位時為遜清光緒三十二年也明年謁普陀四明諸長老不契悵然返岳掛單於祝聖寺專心淨土閱五寒暑越年天然法師歸岳遂從之參文字禪破題初試震驚儕輩天師深許之遂默識之以為佛門法器也辛亥之役譚旭升輩起義寶慶新學暴徒毀寺逐僧師每顧儕輩曰佛教既失金池吾輩之事多矣苟非振興教育整理僧制則佛教前途將不堪設想也乃於民元偕離塵帥晉省肄業僧師範明年又肄業於法政學校精研政法諸世學畢業後行脚至甬供職七塔寺頗有功行寺僧敬之民七遊皖結茅大龍山專究向上一着後皖之聞人馬冀平居士等創辦僧學校於省會之迎江寺師應竺菴上人之邀蒞寺幫助常惺法師襄理教務并任監學等職學僧中有閩南廣津瑞金二師在其座下肄業畢業後返閩遊說閩南諸山及本寺前住持會泉和尚請常師來寺創辦僧教育而育僧材師遂與常師連袂來厦組織閩南佛學院任監學兼訓育主任而本寺亦請師為堂主後堂等職時為民十四也越明年本寺小學部移往漳州南山寺師隨往服務并主持焉南山學校因之發達幾為閩南教育界首屈一指矣民十六本寺住持太虛法師就職後請師為首座并請為代理院長及教務主任等職民十八師因南山學校經費問題往台灣有所籌措不意偶恙返閩竟至不起遂于十九年三月二十日午時圓寂于漳州南山寺矣師為人寡言笑富熱情善辭章工書法詢為佛教僧教育界之翹楚也余忝為私淑泛緣親炙茲特撮其生平梗概以誌不忘云爾二二四二九于閩南佛學院性願法師小傳覺斌釋古志字性願南安古山鄉洪氏子也俗家父母皆奉佛幼年即依德山禪師披剃年十四受具足戒於本寺後參學於浙之天童及江蘇等名剎研究天台教典頗有心得在泉常設講座聽眾極多師聰慧過人善辭章工書法現主講於泉之承天寺佛學研究社宏施法雨普利人天誠閩南僧輩中之翹楚也師為本寺首座服務本寺八年餘以此因緣謹傳以為紀念也二二四二七寫於南普陀寺之監院寮瑞等禪師小傳覺斌釋瑞等字寂平漳州海澄縣白水宮陳氏子也因看破世緣發心出家投本寺依轉武上人座下脫白披鬀焉未幾往興化廣化寺懺摩具足得菩薩戒位後往南洋參學頗有聲譽數年後返國服務本寺任監院職與轉逢長老共謀重建大雄寶殿師力居多佛殿工程告竣引退復往南洋宏法名聞利養無動於衷師之為人於此概見矣而師性好施人所不及如本寺大悲殿此次重建工程浩繁需款眾多師在南洋募有巨款接濟厥功甚偉今特記之以誌不忘云爾二二四二七寫於南普陀寺之監院寮芝峰法師略傳雪生芝峯法師字象賢別號止止齋主人一九年生於温州之樂清縣俗姓石氏祖業農師幼時便具慧根日唯以書自娛一九一三年畢業於縣立高級小學後隨舅氏萬定和尚出家於其本邑之曰龍洞和尚授師以天台止觀之學一九一五年受戒於永嘉之妙智寺師日精研經教之餘復兼究東西名哲之著述一九一九年任職永嘉護國寺時雨僧學校凡三年與師同事之友人相繼迭逝獨手難持師暫忍捨其宏法之事業矣然因世相日遷僧伽日復墮落師不忍坐覩正法之陵夷遂抱挽囘既倒之大願斯時太虛大師倡整理僧制於全國設學府於府昌師乃負笈肩囊遠投於匝門之下凡二年旋里復閉關於永嘉西城落霞潭畔之普覺寺此寺系永嘉大師之道場也寺西隔水城垣蜿蜒數里東望則佳木葱蘢松臺聳翠面視則落霞潭水清碧呈漪後聞宿覺鐘聲隱約可辨如許水影山光晨風晚霧皆足消人長氣星晨月夜柳拂鶯鳴焉起世外之思唯師獨異之閉關未及一載即出創辦三家講舍於護國寺矣師擅長詩文每於課罷之暇常與諸生吟詠於溪橋石畔後二年因感經濟竭厥講舍以致停頓一九二八年承其親教師太虛大師之命來閩院任佛學研究系主講每暑期中復弘法於江浙各處一九三一年任南普陀監院翌年兼任現代佛教月刊之編輯職一九三三年復承太虛大師之命赴鄂任海潮音月刊總編輯職師自出家以還孜孜學業碌碌馳奔為法為人有足多者蓋師之所為者以興佛教為職志絕非盜名沽譽者流之可同日而語也憶師當離鄉將赴閩之時出詩以勉其諸生云惡風暴雨撼潮來佛化於今大可哀為扶砂盤方舉手非同傀儡喜登台無窮妙義湏深造大好時光莫浪摧此度別離無別慮百年又望棟樑材於此又窺師之懷抱與師之志願矣余忝列師之鄉末且得師之教育獨多今師遠涉不無依依聊記概梗以誌不忘云爾大醒法師小傳東初大醒法師字機警別號哭庵江蘇東台袁氏子也生而穎異記力過人沉靜寡言見者稱之雖在童年喜聞佛仙偶覽佛典即悟生死樊籠悉由心造潛超世志擬入梵園阻於尊長志未果行稍壯負笈江都師範學校中西科哲無不潛究然欲得一解决人生生死與夫救世濟民之道則未可也於是决志捨俗皈依佛門即於爾時投江都天甯寺禮讓之長老脫白披薙焉於民十二年懺摩具足得菩薩戒位於維揚之普照寺民十三年夏聽講於海陵光孝寺冬負笈於武昌佛學院也佛化新興運動太虛大師首剏佛學院於武昌為開中國僧教育之先河亦為中國佛教造就宏法利生人材之嚆矢法師在同學中倜儻卓志悲智邁羣每試儕冠諸教師嘖嘖相讚時人則謂為太虛大師門下三大將之一是也太虛大師恆以大乘唯識法相融通大乘八宗之佛化及志在整理僧伽制度論行在瑜伽菩薩戒本牗之故師有新僧會組織於武院作整理佛化第二次新興之運動未幾武院輟學則偕顯教迦林又山宏渡體參本和諸友肄業於南京法相大學師棲止金陵寺選修數課耳後太虛大師於匡山剏立廬山學窘究佛典時習英文者共十人後學窘散七人去北大連師三人留學於匡山師念佛教既無精銳系統之組織又無寺院考究之統計遂一心遍遊全國寺院之首剎如廬山西湖金焦寶華蘇常江都等名剎均涉足焉又每見古德刺血書經心輙敬重至金陵得交機本映徹二上人遂發心刺血書經三次又鑒現代佛學者口裏聖賢心中戈劍遂揜關於金陵寺結以往所學之總賬參究其俗不二二而不二淨名之不二法門也丁卯四月國體軟弱受帝制之威脅英美砲艦擊南京城時諸道友勸其出關以免危險師則答以出與不出死與不死於人生究竟有何裨益耶况今生於國基不固民不聊生之際雖生不如死也諸友苦勸遂出關焉復住金陵或參禪或念佛或讀經行走坐臥一如在關師學貫中西深研科哲尤精佛學時有建議整理僧伽制度論公諸報章名滿天下識與不識莫不知師也師嗟世道緣慳所學未圓時為燄然然民十六太虛大師駐錫南普陀寺奉命南來主持院務代理院長艱困倫節勇於任事旋請為南普陀寺監院福州鼓山湧泉寺虛雲長老又聘為鼓山佛學院院長等職故民二十兩次講學於鼓山誠盛事也閩院為全國學僧之所依歸亦為南國僧教育之學府由師主持五載如一旦畢業兩次成績斐然不啻開南國佛教之新紀元亦為中國僧教育之罕聞也欲挽世界之狂瀾刷新僧伽之不良非揭穿世人之紕繆打破僧伽之黑闇不為功焉故師依虛大師整理僧伽制度論及海潮音雜誌宗旨為宗旨言論為言論創刊現代僧伽後改名現代佛教得芝峯寄塵二法師之合作及各方諸友之鑽助發行以來頗得社會一般人士所讚許雖招一班傋瞀僧伽之阿諛然跌宕不羈之精神終不可改其初衷志若鐵堅且斯刊印刷經費乃師與芝峯法師各負其半或捐薪或募集辛辛苦苦菩薩心腸人所莫及師善書法尤精篆籀復運方便經營翰墨以補刊資故於民二十一與畫家吳君石卿書家虞君佛心合開扇面展覽於南普陀寺如有所得咸充刷金此刊能發行五載不斷不續不變逾乃師之種種方便大悲卓志為法為人之努力耳其他凡有益於佛教者無不犧牲故民十七及民十九邰爽秋氏廟產興學運動舉國僧伽無不悲憤無如一班啞羊僧伽依然昏昏師目擊心傷憤不能已乃發通電喚僧伽於甜途挽狂瀾於萬一及駁斥廟產興學之宣言諸山大德長者及護法居士莫不讚仰之參看現代僧伽第四卷第一期因此竟開全國代表大會於滬上洶湧風潮於是焉息師功也師除講席任事之暇喜于吟詠嘗與謝君雲聲何君達安虞君佛心蘇君警予諸友結海印社往來唱和極盛一時并出有七月集一時紙貴洛陽師來厦五載矣不但南普陀寺及閩院得師掌持中樞亦為廈地諸道友信仰及各界推重往來諸友均極道義相投同為常住負責者則為轉逢會泉二退居覺斌芝鋒二法師同為常住護法者則為蘇君慧純蔡君契誠陳君定謨陳君李樑林君鏡秋諸居士他如董事陳少梧長者道友許宣平黃炯蓀馮重熙諸居士及廣箴笑溪等諸友皆為師來廈同道往來心契之友今師已他適矣與師相契之道友能無動念於衷乎噫吾隨師時短所知不廣今僅述其梗概以誌不忘云爾民二二四九覺斌法師小傳寄塵復文法師字覺斌本省泉州南安陳氏子也因闔家三世長齋奉佛其父及兄妹具有出家一時聞者歎為希有而師又於坐胎之時其母在佛前發願曰如得男當捨為僧故師於三歲時即依本邑紫帽山古玄寺性行禪師披鬀焉年十四往福清黃檗山萬福寺懺摩具足得菩薩戒位從此梵唄清修日益精進雖在髫齡猶如老衲至民國八年因思無常老病不與人期一吸不來剎那異世於是發願行脚實行苦行遍禮聖跡以增道業如山西之五台山親禮兩次安徽之大九華山親禮三次他如杭之天目甬之天童以及三江著名之名山古剎亦稍有參學焉民十六來本寺親近前住持太虛法師為時未久以其老成授以監院襄理事務師自受職以來認真整理六年辛苦厥功甚偉師處世接物持之以寬事上禦下持之以和誠為青年僧伽中之不可多得也師今年三十有七正壯年有為之秋本寺前途實利賴之茲特傳其生活中之片段耳宏聰禪師小傳寄塵本一禪師字宏聰本省泉州惠安曾氏子也年五十看破世緣發心出家遂投思明縣虎溪巖依會泉和尚座下脫白披剃焉民十五年春往福州鼓山湧泉寺懺摩具足得菩薩戒位從此一領袈裟銷磨歲月六字洪名以延天年聞本寺道風來廈掛塔本寺住持見其誠實授以副寺職襄理寺務師亦能實踐厥職擁護常住故本寺六年之一切建築師之規劃盡力居多師今年六十有五勤勞不息精神強健雖三十許人不若也豈佛菩薩之祥光特蔭庇有功行於常住者不然何師之強健如是耶智普禪師小傳寄塵中度禪師字智普本省泉州惠安李氏子也年四十五因勘破世情皈依佛門禮泉之承天寺依宏仁禪師座下脫白披剃焉遜清己未年春發心往興化廣化寺懺摩具足得菩薩戒位從此一瓶一鉢遍參知識向上一着再接再厲聞本寺道風心竊羨之一日振錫飄然來厦本寺住持見其篤實授以副寺一職襄理事務而師自任職以來為時六年上下海眾交口稱讚師之為人於此亦可以見矣師今年六十有一精神強健猶如壯年故逐日埋頭案際計盈虛總出納神氣十足不倦焉如師之為人者誠老僧中之老青年也三居士蔡契誠居士小傳慧心蔡居士福建晋江籍現年廿九歲性和藹嗜內學民十二與陳滌憲董謙六莊漢民蘇慧純等創辦閩南佛化新青年會當時所作佛法是消極的嗎論文曾刊登佛音月刊中緇素咸樂之交經商之餘端熱心衞教工作曾任本縣佛教會執行委員暨本寺護法實事求是絕無浮華囂習去臘與余同皈依太虛大師因締交最久不時過從相與討論法相唯識人情物理之學每有所言輒脗合無間余之老友也故樂為之傳蘇慧純居士小傳前人目光炯炯胸懷落落具菩薩之心腸而不稍減其金剛之威力其惟吾畏友蘇慧純居士乎居士晉江籍年三十懷大才而氣節尤高遇不平事輒痛加抨擊不循私情惟與人為交又謙謙無忤一視同仁才高而能容人長計劃之才也居士除研究佛學及護法外喜治拳術靜坐之學每有所言其境界已與常人不同余昭然異之余與居士締交於閩南佛化新青年會迄今將十稔矣故略知居士之才之長爰寫數語聊志敬仰林鏡秋居士小傳虞愚林鏡秋居士與覺斌上人交情甚篤年四十三福建同安人予與居士雖少相處顧彼此相知固必不泥於形迹之往來也居士經商喜佛學善計劃處事尤勤近年來本寺後山之阿耨達池兜率陀院須摩提國阿蘭若處建築物從中籌劃居士與有力焉今佛門多故龍象為愁居士之出也必將更有造於斯寺余馨香祝之
