body:
  text: 厦門南普陀寺志序中國名山古剎多有志書之作考古家既得覘文化興替之事跡遊覽者復遂探奇訪勝之樂意至善也南普陀寺為廈門最大古剎亦為八景之一雖與其他七景齊名然山水之蓊鬱巖壑之雄奇盖遠過之寺建五代前其間興廢不一詳寺考中自清施琅將軍重修易名南普陀香火漸盛迨民國十三年轉逢和尚更改為十方叢林子孫傳統之痼疾於焉而革民十四之際會泉法師主斯剎因其右偏圮宇頹寮擴為閩南佛學院培植佛教人才請常惺法師長其事由是斯剎遂與南海普陀相輝映而名聞海內矣後太虛大師繼任方丈歷民十六至民二十二辛勤備至佛法益以昌明而退居轉逢和尚監院覺斌芝峯大醒等佐理其事興教育闢後山築水池置禪房駸駸乎有一日千里之概焉今春予承虛大師命任閩院論理學國文教授課餘與寄塵上人合編斯寺寺志歷二閱月斯志始成全志都為七篇曰寺考曰法制曰教育曰列傳曰法物曰文藝曰公牘寺考究斯寺之源委法制記斯寺改為十方叢林之法規教育志閩院創辦歷史及各科之學程列傳彰斯寺德職僧及居士為法之勤勇法物紀斯寺關於佛教美術上之貢獻文藝錄寺內歷代名人之題詠公牘彙各方往來之文件凡此皆寺志組成之各因眾緣而於文化上不無關係在焉惜予與寄塵上人均以事牽未能一一考訂完善深引為憾端供世之關懷名剎者補苴而匡正焉茲編其嚆矢也中華民國二十二年五月勞働節山陰虞愚德元識於廈門大學編者自序本寺剏自五代迄至今日千餘年矣而著名於世成為有紀律有組織之一大新式叢林者近十年間之事耳余於客歲之秋因友之邀再渡來厦以襪線之才濫充教席撫躬自問愧汗多矣今春適值山陰虞君德元任斯院論理國文常識等教授職舊兩重逢倍覺歡慰蓋虞子乃余曩在武昌佛大時之同學也本寺向無寺志識者憾之吾友芝峯大醒二法師嘗發心編輯未果以宏法因緣他適監院覺斌上人慫恿余起草繼醒師志余謾應之未命筆也後又催促不得已商之虞子虞子允任修飾及標點之責余則負搜羅鑒別及督促抄錄焉為時閱二月蕆事今將殺青故贅數語冠首以誌其因緣耳隆耀果地廣究演法笠峰諸師均有抄錄之勞茲特題名于斯以表謝忱中華民國二十有二年五月五日合肥沙門寄塵謹識於閩南佛學院編輯大意本寺向無舊志故參考書付之闕如且斯志屬於初稿未能廣為搜羅詳細考核難免取材浮泛而欠精確耳本志取材根據史實而不涉及附會及遺傳等情凡閃爍其辭語焉不詳者割愛勿濫以昭慎重本志為慎重本寺歷史起見特借有省志府志縣志等為參考書惜咸無詳細紀載殊屬憾事然寺考中僅關于有紀載者照錄無遺蓋紀實也本寺之肇興近十年間之事耳故志中取材亦以近十年為多也尚希先進耆德同輩賢俊後來英髦幸有以教之以補不足本志怱怱付印為時過促掛一漏萬勢所不免如關於各編中之稿件有歷史而有價值者請繕寫清楚郵寄本寺以備再版採入俾臻完美本志如有未當之處完全由編者負責蓋斯志雖屬於南普陀寺志編者自有編輯權但編者見聞有限尚希讀者原諒是幸二二五五寄塵謹識於閩南佛學院廈門南普陀寺志目錄山圖寺考一七法制九二八教育二九七列傳七一一六法物一七一一三文藝一一五一四四公牘一四五一五六南普陀寺全圖圖例房屋墻溪流石堦石欄山錢池塘巖石橋墓地亭臺縮尺九百六十分之一說明一面積東西橫表一千一百二十呎南北縱長一千九百一十呎總計面積二萬六千四百七十二方丈七十六方呎二界址東由鍾山灣合水綫至大観路至華僑路止南普陀路西由鼓山灣至白來水池界合水綫及馬路止南普陀路南至南普陀路北至五老峰頂南普陀住持太虛都監轉達會彔監院覺斌芝峰謹識時民國二十一年十二月二十四日中國民國二十一年十二月測繪者王景琨山圖本寺全景本寺山門外放生池之一瞥本寺大山門之中門本寺鼓樓本寺鐘樓本寺大雄寶殿本寺佛殿之內容本寺走廊之一本寺最近落成之大悲殿按此殿係舊殿燬于火放大重建者詳見本寺建築物沿革中本寺官廳之一角右邊即庫房本寺功德樓及禪堂本寺之小講堂外觀本寺之千手千眼大悲觀世音菩薩像本寺方丈室之外觀即海印樓本寺後山之小亭亭三座今攝壹寺考一本寺寺考虞愚五老山拱隔江太武而峙為厦門八景之一寺奉觀音為主彌勒羅漢天王亦與焉而獨觀音以禱靳輒應故寺改稱普陀冠南者以對浙江定海縣普陀而言若對印土之普陀則斯寺又為北矣方位之分抑亦對待而言也考縣志謂五老山在城南六里山如五老形故名方輿紀要祗述五峯并列無盡巖居其中而不詳其朝代年月日府志載大石嵌空其下虛敞宋僧文翠建普照寺又按普陀寺僧譜陀乃五代僧清造所建其初名泗洲宋治平間始改名普照院迨元至正間廢明洪武有僧覺光重建之崇奉觀音大士暨釋迦文佛明季後燬於兵徴諸志載興廢不一殆示世法之有無常者歟洎清朝康熙間靖海將軍施侯一名琅平鄭姓凱旋重建改名南普陀是為取名之始寺中供觀音大士有鐘鼓二山映帶左右風景之佳昔已盛稱寺興時當居大眾百餘人嘉禾名勝記謂寺中有洞名六月寒洞左有雲巢又有石筧以引水寺右乾龍間復建龍王廟采補稱門列御製平臺紀功碑亭四歷敍戰績寺前有平原一片為鄭延平郡王水師演武塲壁有俞大猷終法海詩俞詩今為苔沒不可復辨皆紀實也斯寺五老凌宵為思明最大佛剎清季曾宴美艦於此外有光復烈士碑民國以還香火日盛民十四年秋會泉法師創閩南佛學院培植佛教人才常惺法師長斯院闢觀音殿右旁屋宇若干間為講堂及學僧宿舍迨民十六太虛大師主斯剎于閩院益求完備實世界佛學苑之華日文系學院而寺中風景屋宇亦多樹建寺後曲徑因勢開闢庚午秋築兜率陀院於其巔此院乃退院轉逢和尚專為太虛大師退居而築者復傍巖阿中設慈宗壇弘慈氏學壇前有阿耨達池池水演演瀸瀸供全寺清眾之用復盡天然形勢益廣其右地以石洞為須摩提國洞內清涼靡常有退居轉逢和尚在焉通洞之右又新建阿蘭若處以為靜坐棲息之所今而後斯寺之設漸備有樹可庥有泉可瀹有院可學有禪房可棲而止焉院左之絕頂有太虛臺民二十年李基鴻居士所建山下遐矚如聳虛空間名寔相符也軒扇亭之上旁太虛大師山陰虞愚等俱有詩刻詳志中文藝篇茲不多錄二本寺建築物沿革寄塵一佛殿及走廊天王殿此殿五間中三間供奉彌勒如來其左右各一間則供奉四天王相高數丈兩層躥角式係民國下五年間本寺住持會泉和尚募化重建者大佛殿位天王殿後共五間中供奉釋迦如來及彌陀如來藥師如來并塑阿難迦葉兩尊者及天帝釋之立像後修有海島及西方三聖立像等高數丈兩層躥角式綠瓦石柱備極莊嚴係民國十年間本寺住持轉逢和尚募化重建者大悲殿此殿一間八角三層飛簷躥角式綠瓦石柱亦如大殿中供奉四十八臂四面大士立像雕刻精美罕有有匹係民國十七年秋舊殿燬於火本寺住持太虛法師與全寺執事力謀重建歷四年之久廢五萬餘金近斯殿始成矣後殿此殿三間接連右邊關帝殿三間左邊地藏殿三間內附客堂蓋後殿為本寺古之大佛殿也鐘鼓樓此樓一間三層躥角式係本寺前住持轉逢和尚建築走廊本寺正序之走廊大佛殿丹墀左右各三間大佛殿兩旁左右各三間供奉十八羅漢二僧寮與客廳流通處此樓新式上下兩大間上有淨室一明間供奉功德主牌位下有淨室一明間設有流通處陳列佛教之各種佛經及佛書等為本寺前住持會泉和尚所建築者念佛堂此樓新式三大間上有客室四下有淨室四明間為念佛堂右邊有清眾寮三私院一自成院落亦頗幽淨祖堂此堂五大間中供奉本寺歷代祖師蓮位兩頭分設廣單本寺行單起住其中有私院一自成院落對面有菓木園一園外尚有工廠五間在祖堂後面有大寮一浴室一大寮後面則有工寮十養性寮一放生園一碾房一客廳此廳三大間旁闢有小室三本寺來往遊客多在此間酬應壁懸古今名人字畫甚多尤覺悅目庫房此房在大悲殿左邊與客廳相接三大間建築既宏光線又足有私院一自成院落後面有披厦多間為常住重要執事及小廚房工人宿舍五觀堂此堂在大悲殿左邊與庫房相接計三大間可容二百餘僧空氣流通頗適合衞生後面有兩間小樓一上面巡照寮一裁縫寮一下面香燈寮一上客堂一本寺左序之僧寮及客廳等共計四十餘間先後建築故年代月日亦不一三佛學院一瞥本院為會泉法師所創辦惟房屋仍因其舊本院計有禮堂一禪觀堂一圖書室一研究室一講堂二教務處一事務處一閱報室一會客室一儲藏室一餐室十教職員室十學僧宿舍十三洗濯處經行場各一水爐一廁室一院中屋宇雖不敷支配幸各室光線空氣皆佳端合講學之用院後有海印樓一為本院院長起居之處旁有關房二共計四十餘間今建築物也四後山之禪室普照寺此寺相傳最古蓋先有普照而後有本寺也詳見本寺寺考寺在山後之右人跡罕到為靜修之地也蓮花洞此洞在後山之左地勢幽靜堪作修道之用惜建築年月日已無可考水池區此水池區為本寺之最近建築有三靜修處兜率陀院須摩提國阿蘭若處是也詳見兜率陀院記及南普陀遊記
