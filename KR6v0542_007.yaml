body:
  text: 公牘一布告福建陸軍第二師第三旅司令部布告第號為示禁事案據南普陀住持轉逢呈稱敬呈者竊南普陀於唐時本名五老山至宋為僧文翠建修普照寺前清康熙間靖海將軍施公琅重建遂改名南普陀今仍其名洵屬廈門一古剎也山石瀉泉海波浴日騷人詞客游覽題詠者代不乏人現在卑寺新造大殿已於三月念五號開始建築值此清和天氣各界紳士來寺焚香禮佛或游覽風景者第良莠不齊每有到放生池釣魚或來偷葬墳墓盜砍樹木折取寺內花果甚至無故藉端吵鬧一切難以言罄且木石工人衆多工作之時誠恐跌落甎瓦致生意外之虞乞念佛門艱苦募化維難將以上數端出示保護等情據此查保存古蹟為盡人所共宜知而興工程尤局外所非應問據該住持所稱擾害各節如果不虛殊屬非是合行出示保護為此諭仰軍民一切人等知悉自示之後毋得再有到該寺釣魚葬墓砍木折花藉端吵鬧情事如敢故違定即重究此布中華民國十年五月十八日給旅長高全忠閩軍總司令部布告第五十八號為出示曉諭事案據南普陀住持僧轉逢呈稱為整頓教務公議條規呈請備案俯准給示以保佛門而杜私弊事竊南普陀寺自景峰老祖開山以來歷年久遠興廢不一至前清光緒間由喜升和尚入寺中興十有餘載百廢俱舉遂擬功成身退立為十方僧衆選賢叢林至宣統三年請小雪峯佛化和尚為住持交替之後喜升和尚圓寂至民國二年佛化和尚亦已物故一時繼任者不得其人乃由監院轉塵攝理寺務七年至民國九年公議僧轉逢充任住持派代表僧瑞等往赴北京請轉逢入寺主席轉逢因念衆意難違勉強就職迄今三載有餘全仗各職僧同心協力重修天王殿鐘鼓樓大雄寶殿次第落成竊思工程雖已就緒條規尚未訂立祇恐日久弊生終非維持久遠之策因特合集職僧兩序首領公同妥議謹遵內務部制定管理寺廟條例並參酌本寺情形採訪各處十方叢林辦法訂立條規二十則理合繕開清摺呈請察核俯准備案給示勒石俾資遵守倘有僧俗人等挾存私見希圖破壞准豫指名稟究以保叢林永垂久遠不勝便德之至等由到部合行出示布告為此示仰各色人等一體遵照妥為保護毋違切切此布中華民國十三年三月二十二日總司令臧致平思明縣公署通告案據南普陀住持僧轉逢監院轉塵呈稱竊南普陀寺自景峰老祖開山以來歷年久遠興廢不一至前清光緒間由喜升和尚入寺中興十有餘載百廢俱舉遂擬功成身退立為十方僧衆選賢叢林至宣統三年請小雪峯佛化和尚為住持交替之後喜升和尚圓寂至民國二年佛化和尚亦已物故一時繼任者不得其人乃由監院僧轉塵攝理寺務七年至民國九年公議僧轉逢充任住持特派代表僧瑞等往赴北京請僧轉逢入寺主席轉逢因念衆意難違勉強就職迄今三載有餘全仗各職僧同心協力重修天王殿鐘鼓樓新建大雄寶殿次第落成竊思工程雖已就緒條規尚未訂立祇恐日久弊生終非維持久遠之策因特合集職僧兩序首領公同妥議謹遵內務部制定管理寺廟條規並參酌本寺情形訪各處十方叢林辦法訂立規條二十則理合繕開清摺呈請察核俯准備案給示勒石俾資遵守倘有僧俗人等挾存私見希圖破壞准豫指名稟究以保叢林永垂久遠不勝便德之至等情附條規二十則到縣據此察閲所訂條規尚屬妥治除批准備案外合行通過闔廈軍民僧人一體知悉務各遵守條規毋得逾越切切特此通告知事邢藍田中華民國十三年三月二十七日給廈門市公安局布告第四三號為布告事案據南普陀寺呈稱呈為請求出示保護事竊敝寺自創辦佛學以來僧衆均主重道德學問對於佛教清規力行不怠上下大衆安心辦道為廈邑各界人士所深知且敝寺所設之佛學院乃為全國僧徒教育高等之學院海內外亦早知名惟引起一班不學無術之僧徒所妬忌日甚一日素常譭謗敝寺近且間有竟藉端滋擾為此相應呈請鈞局准豫給示保護實為功德無量等情據此查該寺佛學院開辦有年闡揚教義研究佛學頗為社會人士所信仰乃有不良僧侶嫉妬譏謗藉端滋擾倘不嚴加防遏誠恐風潮發生貽羞佛門妨害治安據呈前情除飭該管署隨時保護外合行布告仰各周知嗣後無論何方僧侶如敢藉端騷擾准由該院報警嚴拿懲辦不貸其各凜遵切切此布中華民國二十一年七月十四日代理局長林振成駐閩綏靖主任公署布告第號為布告事照得佛學為哲學一端自與神權迷信不同查有太虛法師創立閩南佛學院於南普陀寺該院性質既為研究哲學與平常廟觀之崇拜偶像迷信神權有異可豫保護合行發給布告仰軍民人等一體遵照毋得摧殘為要此布中華民國二十一年月日主任蔣光鼐公安局布告第四二號照得南普陀為閩南名勝之地中外人士多登臨游覽自應共圖維護保存名勝不容濫肄喧擾至學院內地遊玩其間尤應肅靜免礙清修入內聽講研經概須嚴守秩序共維勝地除飭署隨時派警切實保護外合行布告仰該寺遊覽人等一體遵照如有阡意喧擾妨礙安寧立豫拘究不貸其各凜遵切切此布中華民國二十二年二月二十三日局長林鴻飛二函電本寺寺基確定之經過廈門近因商業之發達大有一日千里之勢原有之市場不敷於用另闢新區勢所不免近數年來由路政處將廈門四周之山地劃界開闢範圍極廣本寺之基址亦在其新區計劃中咄咄逼人寺衆譁然原本寺舊所管領之山地極為遼濶但皆屬荒冢穢墟無一明確之界地耳然本寺之山地被侵占而開其先河者先有自來水池之建設今則其勢已凌逼本寺肘腋間則便有華僑所組之興業公司等開闢新區且有將本寺山地作為公園之議民二十本寺當局同全寺內外護人與之交涉遂由路政處退還山地若干並發有證明書劃定界址地圖等由本寺將收回之山地清理改造永為本寺之林區于是本寺地基既穩定且又為本寺造成一形勢之名勝茲將路政處之證明書及法院之不動産登記證明書録附于下一路政處證明書漳厦海軍警備司令部路政辦事處發給證明書事查本處開闢南普陀附近山地為大南新區茲為保存古蹟起見特將該寺左右山地編列新區計第二號地第二百捌拾一井二拾伍方尺第拾叁號地叁百柒拾一井捌拾柒尺第二拾玖號地伍百伍拾井合計一千二百零三井一拾方尺仍歸該寺掌管為林園之用此項林園之地永歸該寺管理不得售與他人除由本處將該寺原有寺地及山地並新撥林園之地分別劃定界址外合行發給證明書一紙附圖一份仰該寺即便遵照執管可也須至證明書者附圖一份右給南普陀寺收執中華民國二十二年一月二十八日印二法院不動産登記證明書不動産登記證明書登記人姓名南普陀寺印登記號數不動産登記簿區第一七九冊第一號收件年月日及號數中華民國二十二年二月八日收件第一三四號不動産之標示基地計英尺二六四七二平方尺廈門南普陀寺址在院嶼保五老峯下東至鐘山灣合水線至大觀路華僑路南普陀止西中鼓山灣至自來水池界合水線及南普陀止南至南普陀路北至五老峯頂印登記原因及其年月日提出民國二十二年二月日住持太虛聲請字一紙印登記標的所有權保存登記印權利先後欄數所有權部第一欄登記年月日中華民國二十二年二月二十七右證明登記完畢中華民國二十二年二月二十七日福建思明地方法院登記處印三附本寺聲請書厦門南普陀寺址在院嶼保五老峰下建自唐代為閩南大叢林之一領地廣袤依山為界近因路政處開闢大南新區劃定領土東由鐘山灣合水線至大觀路華僑路南普陀路止西由鼓山灣至自來水池界合水線及南普陀山南至南普陀路止北至五老峯頂面積東西橫姿一千一百二十尺南北縱長一千九百一十尺總計面積二萬六千四百七十二方尺估價值一萬元測繪及估價均極準確特請登記保存監院覺斌印芝峯印都監轉逢印會泉印中華民國二十二年二月日住持太虛印代書人陳少卿押蔣光鼐將軍來電厦門南普陀太虛和尚大鑒先電敬悉忝膺閩政滋愧詮才藻飾有加良深感謝一專復即候時祺弟蔣光鼐皓中華民國二十一年十二月十九日印賀班禪頞爾德尼就職電南京班禪大師慈鑒逖聞就職宣化弘法救世開政教之合作為通俗所宗仰特電敬賀並頌福祉太虛叩有班禪頞爾德尼覆電廈門探投太虛法師惠鑒有電敬悉禪此次蒙中央優遇特派宣化西陲材輕任重無補時艱復承電賀益增汗顏此後尚祈不遺在遠時錫南針俾匡不逮特覆鳴謝順頌法祺班禪頞爾德尼儉蔣光鼐將軍來書太虛法師淨几承囑保護南普陀山林區一節當即馳函周處長酌辦夫保護廟産本有專條公路施設乃利民之政亦不容有緩我佛度人當同此旨苟公路建築有可避免者周君必能為力保護佛學院布告已飾處辦理專此奉復即頌法綏蔣光鼎啓
